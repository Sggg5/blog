<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>.t{font:700 34px Arial,'Microsoft YaHei';fill:#164a84}.h{font:700 23px Arial,'Microsoft YaHei';fill:#164a84}.b{font:18px Arial,'Microsoft YaHei';fill:#40566d}.box{fill:#fff;stroke:#a9bfd3;stroke-width:2}</style><rect width="1200" height="620" fill="#f8fbfe"/><text x="600" y="60" text-anchor="middle" class="t">不锈钢表面游离铁污染的形成链</text><g><rect x="55" y="150" width="230" height="180" rx="18" class="box"/><text x="170" y="205" text-anchor="middle" class="h">污染来源</text><text x="170" y="250" text-anchor="middle" class="b">碳钢工装 / 钢丝刷</text><text x="170" y="285" text-anchor="middle" class="b">铁屑 / 打磨粉尘</text><rect x="350" y="150" width="230" height="180" rx="18" class="box"/><text x="465" y="205" text-anchor="middle" class="h">嵌入或沉积</text><text x="465" y="250" text-anchor="middle" class="b">铁颗粒留在表面</text><text x="465" y="285" text-anchor="middle" class="b">肉眼可能看不见</text><rect x="645" y="150" width="230" height="180" rx="18" class="box"/><text x="760" y="205" text-anchor="middle" class="h">潮湿暴露</text><text x="760" y="250" text-anchor="middle" class="b">外来铁先发生锈蚀</text><text x="760" y="285" text-anchor="middle" class="b">形成红褐色锈点</text><rect x="940" y="150" width="205" height="180" rx="18" class="box"/><text x="1042" y="205" text-anchor="middle" class="h">误判</text><text x="1042" y="250" text-anchor="middle" class="b">“不锈钢生锈”</text><text x="1042" y="285" text-anchor="middle" class="b">却未追污染源</text></g><g stroke="#557b9e" stroke-width="4" fill="none"><path d="M285 240H340"/><path d="M580 240H635"/><path d="M875 240H930"/></g><rect x="170" y="410" width="860" height="110" rx="18" fill="#eaf2f8" stroke="#a9bfd3"/><text x="600" y="455" text-anchor="middle" class="h">控制重点：不只是“把锈擦掉”</text><text x="600" y="495" text-anchor="middle" class="b">隔离碳钢污染源 → 清洗/酸洗去除外来铁 → 验证清洁度 → 防止二次污染</text></svg>