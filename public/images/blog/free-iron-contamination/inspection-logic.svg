<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.t{font:700 34px Arial,'Microsoft YaHei';fill:#164a84}.h{font:700 22px Arial,'Microsoft YaHei';fill:#164a84}.b{font:18px Arial,'Microsoft YaHei';fill:#40566d}.box{fill:#fff;stroke:#aac0d3;stroke-width:2}</style><rect width="1200" height="650" fill="#f8fbfe"/><text x="600" y="58" text-anchor="middle" class="t">发现不锈钢红锈点后的现场排查顺序</text><g><rect x="90" y="120" width="1020" height="80" rx="16" class="box"/><text x="130" y="170" class="h">1　先看分布</text><text x="350" y="170" class="b">是否集中在搬运接触、夹具、打磨、焊接或存放位置？</text><rect x="90" y="220" width="1020" height="80" rx="16" class="box"/><text x="130" y="270" class="h">2　追工艺接触</text><text x="350" y="270" class="b">碳钢工作台、普通钢丝刷、砂轮粉尘、叉车/料架是否共用？</text><rect x="90" y="320" width="1020" height="80" rx="16" class="box"/><text x="130" y="370" class="h">3　做表面验证</text><text x="350" y="370" class="b">按采购规范或A380/A967体系选择适当的游离铁/清洁度确认方法</text><rect x="90" y="420" width="1020" height="80" rx="16" class="box"/><text x="130" y="470" class="h">4　去除并复验</text><text x="350" y="470" class="b">清洗、除鳞/酸洗或合适钝化后，确认污染已去除而非仅遮盖锈迹</text><rect x="90" y="520" width="1020" height="80" rx="16" fill="#eaf2f8" stroke="#aac0d3" stroke-width="2"/><text x="130" y="570" class="h">5　关闭污染源</text><text x="350" y="570" class="b">工具、工位、料架和包装分区，防止产品处理后再次沾铁</text></g></svg>