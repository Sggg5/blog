<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>.t{font:700 34px Arial,'Microsoft YaHei';fill:#164a84}.h{font:700 21px Arial,'Microsoft YaHei';fill:#164a84}.b{font:17px Arial,'Microsoft YaHei';fill:#40566d}.n{font:700 23px Arial;fill:white}</style><rect width="1200" height="620" fill="#f8fbfe"/><text x="600" y="58" text-anchor="middle" class="t">焊后表面处理：不要把“去颜色”和“恢复耐蚀性”混为一谈</text><g transform="translate(80,145)"><rect width="260" height="280" rx="18" fill="white" stroke="#cadbea"/><circle cx="45" cy="45" r="25" fill="#2477c5"/><text x="45" y="53" text-anchor="middle" class="n">1</text><text x="85" y="52" class="h">机械清理</text><text x="25" y="105" class="b">可去除氧化层与表面缺陷</text><text x="25" y="140" class="b">效果取决于磨削深度与洁净度</text><text x="25" y="175" class="b">工具若含铁污染反而埋下锈源</text><text x="25" y="225" class="b">适合局部修整，但不能只追求</text><text x="25" y="255" class="b">“磨亮了”。</text></g><g transform="translate(470,145)"><rect width="260" height="280" rx="18" fill="white" stroke="#cadbea"/><circle cx="45" cy="45" r="25" fill="#2f8b57"/><text x="45" y="53" text-anchor="middle" class="n">2</text><text x="85" y="52" class="h">酸洗</text><text x="25" y="105" class="b">目的之一是去除热变色氧化物</text><text x="25" y="140" class="b">以及受影响的薄表层</text><text x="25" y="175" class="b">形成洁净金属表面</text><text x="25" y="225" class="b">为后续自然再钝化</text><text x="25" y="255" class="b">创造条件。</text></g><g transform="translate(860,145)"><rect width="260" height="280" rx="18" fill="white" stroke="#cadbea"/><circle cx="45" cy="45" r="25" fill="#755bb2"/><text x="45" y="53" text-anchor="middle" class="n">3</text><text x="85" y="52" class="h">钝化</text><text x="25" y="105" class="b">重点是改善洁净表面的</text><text x="25" y="140" class="b">钝化状态</text><text x="25" y="175" class="b">它不是用来替代酸洗</text><text x="25" y="225" class="b">去除厚重焊接氧化皮的</text><text x="25" y="255" class="b">万能步骤。</text></g><text x="600" y="505" text-anchor="middle" class="h">判断标准应从“表面看起来亮不亮”转向“热变色与污染是否真正被去除”</text></svg>