<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.t{font:700 34px Arial,'Microsoft YaHei';fill:#164a84}.h{font:700 22px Arial,'Microsoft YaHei';fill:#164a84}.b{font:18px Arial,'Microsoft YaHei';fill:#40566d}</style><rect width="1200" height="650" fill="#f8fbfe"/><text x="600" y="55" text-anchor="middle" class="t">焊接热变色为什么会降低局部耐蚀性？</text><rect x="90" y="120" width="1020" height="340" rx="18" fill="white" stroke="#cbdbea"/><rect x="150" y="190" width="900" height="170" rx="85" fill="#dfe7ed"/><path d="M470 190 Q600 115 730 190 L730 360 Q600 435 470 360Z" fill="#c5a06b" opacity=".85"/><path d="M520 190 Q600 145 680 190 L680 360 Q600 405 520 360Z" fill="#5c75a8" opacity=".75"/><rect x="575" y="170" width="50" height="210" rx="20" fill="#aab4bd"/><text x="600" y="280" text-anchor="middle" class="h">焊缝</text><text x="315" y="235" text-anchor="middle" class="h">母材表面</text><text x="315" y="270" text-anchor="middle" class="b">稳定钝化膜</text><text x="805" y="230" text-anchor="middle" class="h">热变色区</text><text x="805" y="265" text-anchor="middle" class="b">较厚的高温氧化膜</text><text x="805" y="300" text-anchor="middle" class="b">膜下可形成贫铬层</text><text x="600" y="515" text-anchor="middle" class="h">关键不是“颜色本身会腐蚀”，而是颜色提示表面经历了高温氧化与成分重新分配</text><text x="600" y="555" text-anchor="middle" class="b">去除热变色及其下方受影响表层，才能为重新形成均匀钝化膜创造条件</text></svg>