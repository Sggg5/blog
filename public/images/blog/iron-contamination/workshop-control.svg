<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>.t{font:700 34px 'Microsoft YaHei',sans-serif;fill:#174f8a}.h{font:700 21px 'Microsoft YaHei',sans-serif;fill:#244b73}.b{font:400 17px 'Microsoft YaHei',sans-serif;fill:#40566f}.g{font:700 18px 'Microsoft YaHei',sans-serif;fill:#287052}</style><rect width="1200" height="760" rx="24" fill="#f8fbfe"/><text x="600" y="58" text-anchor="middle" class="t">混合加工车间：防铁污染比返工除锈便宜得多</text><text x="600" y="92" text-anchor="middle" class="b">控制重点不是“最后擦亮”，而是从工具、工位、搬运到成品保护建立隔离。</text><g transform="translate(85,145)"><rect width="470" height="475" rx="22" fill="#fff" stroke="#d1dfeb"/><text x="235" y="45" text-anchor="middle" class="h">高风险做法</text><text x="45" y="100" class="b">× 碳钢与不锈钢共用钢丝刷、砂轮</text><text x="45" y="150" class="b">× 碳钢磨削粉尘落到不锈钢工位</text><text x="45" y="200" class="b">× 成形辊、模具加工碳钢后直接切换</text><text x="45" y="250" class="b">× 碳钢链条、吊钩直接接触成品表面</text><text x="45" y="300" class="b">× 不锈钢件直接放在生锈的钢制台面</text><text x="45" y="350" class="b">× 发现红锈只用抹布擦掉，不追污染源</text><text x="45" y="415" class="b">结果：污染反复出现，酸洗返工增加，</text><text x="45" y="445" class="b">严重时留下点蚀和外观投诉。</text></g><g transform="translate(645,145)"><rect width="470" height="475" rx="22" fill="#eef7f2" stroke="#c9dfd2"/><text x="235" y="45" text-anchor="middle" class="h">推荐控制</text><text x="45" y="100" class="g">✓ 不锈钢专用刷具、砂轮、磨片并做标识</text><text x="45" y="150" class="g">✓ 碳钢磨削区与不锈钢区物理/时序隔离</text><text x="45" y="200" class="g">✓ 共用设备切换前清洁辊轮、模具、台面</text><text x="45" y="250" class="g">✓ 吊具接触面采用洁净保护层或合适材料</text><text x="45" y="300" class="g">✓ 半成品、成品覆盖保护，避免二次污染</text><text x="45" y="350" class="g">✓ 返修时真正去除铁污染，不只是摊开锈迹</text><text x="45" y="415" class="g">✓ 最终清洁后再进行需要的酸洗/钝化处理</text></g><rect x="150" y="655" width="900" height="58" rx="16" fill="#e9f1f8"/><text x="600" y="692" text-anchor="middle" class="h">质量管理思路：把“自由铁污染”当作工序污染源控制，而不是成品外观问题。</text></svg>