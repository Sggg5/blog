<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.t{font:700 34px 'Microsoft YaHei',sans-serif;fill:#174f8a}.h{font:700 22px 'Microsoft YaHei',sans-serif;fill:#244b73}.b{font:400 17px 'Microsoft YaHei',sans-serif;fill:#40566f}.n{font:700 18px 'Microsoft YaHei',sans-serif;fill:#b24b3d}</style><rect width="1200" height="700" rx="24" fill="#f8fbfe"/><text x="600" y="58" text-anchor="middle" class="t">不锈钢表面的“锈”可能从碳钢工具开始</text><text x="600" y="92" text-anchor="middle" class="b">自由铁颗粒被带到不锈钢表面，在潮湿环境中先锈蚀，并可能进一步破坏局部耐蚀状态。</text><g transform="translate(70,160)"><rect width="250" height="250" rx="20" fill="#eef4fa" stroke="#cbdce9"/><text x="125" y="50" text-anchor="middle" class="h">① 污染来源</text><text x="125" y="100" text-anchor="middle" class="b">碳钢钢丝刷</text><text x="125" y="135" text-anchor="middle" class="b">共用砂轮 / 模具 / 辊轮</text><text x="125" y="170" text-anchor="middle" class="b">碳钢粉尘、吊具、链条</text><text x="125" y="215" text-anchor="middle" class="n">铁颗粒转移</text></g><path d="M330 285 H445" stroke="#7894ad" stroke-width="5"/><path d="M445 285 l-18 -12 v24z" fill="#7894ad"/><g transform="translate(460,160)"><rect width="280" height="250" rx="20" fill="#fff4e8" stroke="#ead4b8"/><text x="140" y="50" text-anchor="middle" class="h">② 潮湿后先出现锈斑</text><rect x="45" y="90" width="190" height="80" rx="18" fill="#cbd3d8"/><circle cx="90" cy="125" r="10" fill="#a55732"/><circle cx="145" cy="145" r="7" fill="#a55732"/><circle cx="195" cy="115" r="12" fill="#a55732"/><text x="140" y="215" text-anchor="middle" class="b">表面看起来像“不锈钢生锈”</text></g><path d="M750 285 H865" stroke="#7894ad" stroke-width="5"/><path d="M865 285 l-18 -12 v24z" fill="#7894ad"/><g transform="translate(880,160)"><rect width="250" height="250" rx="20" fill="#f7eeee" stroke="#e4c9c5"/><text x="125" y="50" text-anchor="middle" class="h">③ 严重时局部腐蚀</text><text x="125" y="105" text-anchor="middle" class="b">锈蚀产物 + 沉积物</text><text x="125" y="140" text-anchor="middle" class="b">阻碍表面重新钝化</text><text x="125" y="175" text-anchor="middle" class="b">不利环境下可诱发点蚀</text><text x="125" y="220" text-anchor="middle" class="n">不是只擦掉红锈就结束</text></g><rect x="105" y="485" width="990" height="125" rx="20" fill="#eaf2fa" stroke="#cadbe8"/><text x="600" y="525" text-anchor="middle" class="h">现场判断的关键：先问“锈来自哪里”，再问“基体有没有被腐蚀”</text><text x="600" y="565" text-anchor="middle" class="b">如果只是转移铁污染，及时去除污染并恢复洁净表面通常可以解决；若已出现点蚀坑，则必须继续评估环境、牌号和表面状态。</text></svg>