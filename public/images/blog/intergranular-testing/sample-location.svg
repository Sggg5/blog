<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#183b5b}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.pipe{fill:#edf3f7;stroke:#496d8b;stroke-width:3}.w{fill:#b9cad7;stroke:#496d8b;stroke-width:2}.haz{fill:#dfe9f0;stroke:#7b96aa;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#496d8b;stroke-width:2}</style><text x="60" y="60" class="t">焊接件取样：试样位置决定你实际在验证什么</text><rect x="90" y="180" width="1020" height="180" rx="90" class="pipe"/><rect x="555" y="180" width="90" height="180" class="w"/><rect x="480" y="180" width="75" height="180" class="haz"/><rect x="645" y="180" width="75" height="180" class="haz"/><text x="565" y="275" class="h">焊缝</text><text x="465" y="150" class="b">热影响区</text><text x="650" y="150" class="b">热影响区</text><line x1="280" y1="360" x2="280" y2="435" class="line"/><line x1="520" y1="360" x2="520" y2="435" class="line"/><line x1="600" y1="360" x2="600" y2="435" class="line"/><line x1="680" y1="360" x2="680" y2="435" class="line"/><line x1="920" y1="360" x2="920" y2="435" class="line"/><text x="225" y="475" class="h">母材</text><text x="460" y="475" class="h">HAZ</text><text x="560" y="475" class="h">焊缝</text><text x="650" y="475" class="h">HAZ</text><text x="865" y="475" class="h">母材</text><text x="120" y="550" class="b">工程重点：若投诉或失效集中在焊接区，只取远离焊缝的母材，可能得到“合格”却没有回答真正的问题。</text></svg>