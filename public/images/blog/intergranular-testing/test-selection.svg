<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#183b5b}.t{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.box{fill:#f5f8fb;stroke:#4d7191;stroke-width:2}.a{stroke:#6b879f;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b879f"/></marker></defs><text x="60" y="60" class="t">晶间腐蚀试验：先明确目的，再选方法</text><rect x="70" y="120" width="260" height="120" rx="12" class="box"/><text x="100" y="165" class="h">1 试样代表什么？</text><text x="100" y="202" class="b">母材 / 焊接接头 / 热处理件</text><rect x="470" y="120" width="260" height="120" rx="12" class="box"/><text x="500" y="165" class="h">2 要回答什么？</text><text x="500" y="202" class="b">是否存在晶间腐蚀敏感性</text><rect x="870" y="120" width="260" height="120" rx="12" class="box"/><text x="900" y="165" class="h">3 依据什么标准？</text><text x="900" y="202" class="b">合同指定 ASTM / ISO / GB</text><path d="M330 180 H460" class="a"/><path d="M730 180 H860" class="a"/><rect x="140" y="330" width="360" height="160" rx="12" class="box"/><text x="175" y="375" class="h">筛查 / 组织分类</text><text x="175" y="415" class="b">例如草酸浸蚀类快速筛查</text><text x="175" y="450" class="b">用途是分流，不等于所有环境性能</text><rect x="700" y="330" width="360" height="160" rx="12" class="box"/><text x="735" y="375" class="h">腐蚀暴露 / 弯曲或失重评价</text><text x="735" y="415" class="b">按指定介质、时间与判据执行</text><text x="735" y="450" class="b">结果只回答标准规定的晶间腐蚀问题</text><path d="M600 240 V290 H320 V320" class="a"/><path d="M600 290 H880 V320" class="a"/><text x="180" y="565" class="b">关键：不能把“某一种试验合格”外推成点蚀、应力腐蚀或所有介质下都安全。</text></svg>