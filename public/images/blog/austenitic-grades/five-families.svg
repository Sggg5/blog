<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d">
<title id="t">奥氏体不锈钢五种常用合金分组</title><desc id="d">从铬锰、铬镍、铬镍钼到高性能和高温奥氏体，强调是用途分组而非高低等级。</desc>
<rect width="1200" height="730" fill="#f8fafc"/>
<text x="56" y="67" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="700" fill="#173a62">奥氏体不锈钢：按合金目的分组</text>
<text x="56" y="110" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" fill="#61748a">不是从低到高的质量等级；牌号必须对应使用环境和产品标准</text>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<rect x="55" y="155" width="510" height="138" rx="16" fill="#e9f0f8" stroke="#c2d1e2"/>
<rect x="635" y="155" width="510" height="138" rx="16" fill="#e9f0f8" stroke="#c2d1e2"/>
<rect x="55" y="319" width="510" height="138" rx="16" fill="#e9f0f8" stroke="#c2d1e2"/>
<rect x="635" y="319" width="510" height="138" rx="16" fill="#e9f0f8" stroke="#c2d1e2"/>
<rect x="55" y="483" width="1090" height="138" rx="16" fill="#edf4f6" stroke="#c2d5db"/>
<g font-size="26" font-weight="700" fill="#214d80">
<text x="85" y="201">铬锰系 Cr–Mn</text><text x="665" y="201">铬镍系 Cr–Ni</text>
<text x="85" y="365">铬镍钼系 Cr–Ni–Mo</text><text x="665" y="365">高性能奥氏体系</text>
<text x="85" y="529">高温奥氏体系</text>
</g>
<g font-size="21" fill="#334b64">
<text x="85" y="241">常见：201、202</text><text x="85" y="272">减少部分镍，借助锰、氮稳定组织</text>
<text x="665" y="241">常见：304、304L</text><text x="665" y="272">通用成形、焊接与耐蚀需求</text>
<text x="85" y="405">常见：316、316L</text><text x="85" y="436">钼改善部分氯化物局部腐蚀表现</text>
<text x="665" y="405">示例：904L、254 SMO（6Mo）</text><text x="665" y="436">为更苛刻环境设计，不能简单互换</text>
<text x="85" y="569">示例：310S</text><text x="85" y="601">重在高温氧化与使用稳定性；并非室温耐蚀排名</text>
</g>
<text x="55" y="684" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" fill="#61748a">分组参考 Outokumpu 奥氏体钢五子类；具体牌号化学成分以适用标准为准。</text>
</g>
</svg>
