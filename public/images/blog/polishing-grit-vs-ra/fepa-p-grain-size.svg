<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">涂附磨具FEPA P号粒度与中位等效粒径</title>
  <desc id="desc">P240至P1200依次对应约58.5、46.2、35、25.8、21.8、18.3及15.3微米，表示磨粒粒径，并非加工表面粗糙度。</desc>
  <rect width="1200" height="670" rx="26" fill="#f9fbfe"/>
  <text x="62" y="74" font-family="Arial,Microsoft YaHei,sans-serif" font-size="34" font-weight="700" fill="#173f70">磨料越细，P号越大</text>
  <text x="62" y="112" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" fill="#64758a">ISO 6344-3:2021 · 中位等效粒径（μm）· 不是 Ra 值</text>
  <rect x="40" y="146" width="1120" height="445" rx="16" fill="white" stroke="#dfe7f1"/>
  <g stroke="#e9eef4" stroke-width="2">
    <line x1="220" y1="191" x2="220" y2="545"/>
    <line x1="397" y1="191" x2="397" y2="545"/>
    <line x1="574" y1="191" x2="574" y2="545"/>
    <line x1="751" y1="191" x2="751" y2="545"/>
    <line x1="928" y1="191" x2="928" y2="545"/>
    <line x1="1105" y1="191" x2="1105" y2="545"/>
  </g>
  <g font-family="Arial,Microsoft YaHei,sans-serif" font-size="18" fill="#607389" text-anchor="middle">
    <text x="220" y="179">0</text><text x="397" y="179">10</text><text x="574" y="179">20</text><text x="751" y="179">30</text><text x="928" y="179">40</text><text x="1105" y="179">50+</text>
  </g>
  <g font-family="Arial,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#1f4166" text-anchor="end">
    <text x="187" y="231">P240</text><text x="187" y="282">P320</text><text x="187" y="333">P400</text><text x="187" y="384">P600</text><text x="187" y="435">P800</text><text x="187" y="486">P1000</text><text x="187" y="537">P1200</text>
  </g>
  <g fill="#2874aa">
    <rect x="220" y="207" width="831" height="30" rx="6"/>
    <rect x="220" y="258" width="657" height="30" rx="6"/>
    <rect x="220" y="309" width="497" height="30" rx="6"/>
    <rect x="220" y="360" width="366" height="30" rx="6"/>
    <rect x="220" y="411" width="310" height="30" rx="6"/>
    <rect x="220" y="462" width="260" height="30" rx="6"/>
    <rect x="220" y="513" width="217" height="30" rx="6"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#0b3756">
    <text x="1061" y="231">58.5</text><text x="887" y="282">46.2</text><text x="727" y="333">35.0</text><text x="596" y="384">25.8</text><text x="540" y="435">21.8</text><text x="490" y="486">18.3</text><text x="447" y="537">15.3</text>
  </g>
  <text x="60" y="629" font-family="Arial,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#a34934">注意：颗粒尺寸 ≠ 磨削沟槽深度 ≠ 表面 Ra / Rz</text>
</svg>
