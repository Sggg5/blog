<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#16324f}.h{font-size:34px;font-weight:700}.s{font-size:20px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2}.key{fill:#eef5fb;stroke:#2d6ea3;stroke-width:2}.a{stroke:#7b8fa1;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b8fa1"/></marker></defs><text x="60" y="65" class="t h">怀疑晶间腐蚀敏感性时，检验应回答什么？</text><text x="60" y="105" class="t b">ASTM A262提供的是奥氏体不锈钢晶间腐蚀敏感性评价路径，不是所有腐蚀问题的万能试验。</text><rect x="70" y="165" width="245" height="125" rx="16" class="key"/><text x="192" y="205" text-anchor="middle" class="t s">现场出现疑点</text><text x="192" y="238" text-anchor="middle" class="t b">焊接热循环？</text><text x="192" y="265" text-anchor="middle" class="t b">长期高温暴露？</text><rect x="390" y="165" width="300" height="125" rx="16" class="box"/><text x="540" y="205" text-anchor="middle" class="t s">先明确材料与热史</text><text x="540" y="238" text-anchor="middle" class="t b">304 / 304L / 316L 等</text><text x="540" y="265" text-anchor="middle" class="t b">焊接、热处理、服役温度</text><rect x="765" y="165" width="365" height="125" rx="16" class="box"/><text x="947" y="205" text-anchor="middle" class="t s">再选择适用试验</text><text x="947" y="238" text-anchor="middle" class="t b">A262 Practice A 可作快速筛查</text><text x="947" y="265" text-anchor="middle" class="t b">其他Practice按牌号与目的选择</text><path d="M315 228 H380" class="a"/><path d="M690 228 H755" class="a"/><rect x="130" y="385" width="280" height="145" rx="16" class="box"/><text x="270" y="425" text-anchor="middle" class="t s">结果一：筛查可接受</text><text x="270" y="460" text-anchor="middle" class="t b">说明对相应晶间腐蚀试验</text><text x="270" y="488" text-anchor="middle" class="t b">可按标准规则进一步处置</text><rect x="460" y="385" width="280" height="145" rx="16" class="key"/><text x="600" y="425" text-anchor="middle" class="t s">结果二：可疑</text><text x="600" y="460" text-anchor="middle" class="t b">不能直接等同于服役失效</text><text x="600" y="488" text-anchor="middle" class="t b">按适用热酸试验继续评价</text><rect x="790" y="385" width="280" height="145" rx="16" class="box"/><text x="930" y="425" text-anchor="middle" class="t s">边界：别扩大结论</text><text x="930" y="460" text-anchor="middle" class="t b">A262不用于直接预测点蚀、</text><text x="930" y="488" text-anchor="middle" class="t b">均匀腐蚀或应力腐蚀开裂</text><path d="M947 290 V340 H270 V375" class="a"/><path d="M947 340 H600 V375" class="a"/><path d="M947 340 V375" class="a"/><text x="600" y="620" text-anchor="middle" class="t s">质量管理的关键不是“做一个腐蚀试验”，而是先确认失效模式，再选对试验。</text></svg>