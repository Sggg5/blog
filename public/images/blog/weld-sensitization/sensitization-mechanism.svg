<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#16324f}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2}.key{fill:#eef5fb;stroke:#2d6ea3;stroke-width:2}.gb{stroke:#657f96;stroke-width:5}.c{fill:#315f86}.a{stroke:#7b8fa1;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#7b8fa1"/></marker></defs><text x="60" y="65" class="t h">焊接敏化：问题不在焊缝颜色，而在晶界附近的铬分配</text><text x="60" y="105" class="t b">奥氏体不锈钢在不利热循环下，晶界碳化物析出可造成邻近区域贫铬，从而增加晶间腐蚀敏感性。</text><rect x="70" y="165" width="300" height="360" rx="18" class="box"/><text x="220" y="205" text-anchor="middle" class="t s">① 正常固溶状态</text><path d="M110 270 L200 230 L285 285 L330 245 M110 270 L155 365 L250 340 L285 285 M155 365 L130 455 L235 480 L250 340 M250 340 L330 390 L330 245 M235 480 L330 390" class="gb"/><text x="220" y="505" text-anchor="middle" class="t b">铬在基体中分布较均匀</text><rect x="450" y="165" width="300" height="360" rx="18" class="key"/><text x="600" y="205" text-anchor="middle" class="t s">② 经历敏化热循环</text><path d="M490 270 L580 230 L665 285 L710 245 M490 270 L535 365 L630 340 L665 285 M535 365 L510 455 L615 480 L630 340 M630 340 L710 390 L710 245 M615 480 L710 390" class="gb"/><circle cx="580" cy="230" r="10" class="c"/><circle cx="665" cy="285" r="10" class="c"/><circle cx="630" cy="340" r="10" class="c"/><circle cx="535" cy="365" r="10" class="c"/><circle cx="615" cy="480" r="10" class="c"/><text x="600" y="505" text-anchor="middle" class="t b">晶界析出铬碳化物</text><rect x="830" y="165" width="300" height="360" rx="18" class="box"/><text x="980" y="205" text-anchor="middle" class="t s">③ 腐蚀环境进入</text><path d="M870 270 L960 230 L1045 285 L1090 245 M870 270 L915 365 L1010 340 L1045 285 M915 365 L890 455 L995 480 L1010 340 M1010 340 L1090 390 L1090 245 M995 480 L1090 390" class="gb"/><path d="M960 230 L1045 285 L1010 340 L915 365" stroke="#2d6ea3" stroke-width="12" fill="none"/><text x="980" y="505" text-anchor="middle" class="t b">贫铬晶界附近优先受攻击</text><path d="M370 345 H440" class="a"/><path d="M750 345 H820" class="a"/><rect x="160" y="580" width="880" height="85" rx="16" class="key"/><text x="600" y="615" text-anchor="middle" class="t s">工程重点</text><text x="600" y="645" text-anchor="middle" class="t b">低碳 L 级、稳定化牌号、合理焊接热输入与必要的固溶处理，都是降低敏化风险的不同手段。</text></svg>