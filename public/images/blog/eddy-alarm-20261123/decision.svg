<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430"><rect width="1100" height="430" fill="#f7f9fb"/><text x="30" y="48" font-size="27" fill="#19394e">涡流报警处置与复验流程</text><g font-size="21" text-anchor="middle" fill="#18364b"><rect x="30" y="110" width="220" height="95" rx="12" fill="#dcebf2" stroke="#4e7488"/><text x="140" y="151">记录报警位置</text><text x="140" y="181">隔离对应管段</text><rect x="310" y="110" width="220" height="95" rx="12" fill="#dcebf2" stroke="#4e7488"/><text x="420" y="151">核查设备状态</text><text x="420" y="181">参考样管复核</text><rect x="590" y="110" width="220" height="95" rx="12" fill="#dcebf2" stroke="#4e7488"/><text x="700" y="151">按程序复验</text><text x="700" y="181">必要时补充检测</text><rect x="870" y="110" width="200" height="95" rx="12" fill="#dcebf2" stroke="#4e7488"/><text x="970" y="151">授权判定</text><text x="970" y="181">记录处置结果</text></g><g stroke="#35627a" stroke-width="4" fill="none"><path d="M250 157 H310"/><path d="M530 157 H590"/><path d="M810 157 H870"/></g><rect x="80" y="275" width="940" height="86" rx="10" fill="#fff3e5" stroke="#d6a06a"/><text x="100" y="311" font-size="22" fill="#754a23">关键原则：报警不等于缺陷定性；无依据的调低灵敏度或重复扫查不能作为放行理由</text><text x="100" y="343" font-size="19" fill="#754a23">保留原始信号、设备参数、复验结果与处置审批，确保可追溯</text></svg>