<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" fill="#f5f8fa"/><text x="35" y="48" font-size="28" fill="#17324b">气密试验：压力变化的四类来源</text><rect x="30" y="90" width="200" height="110" rx="12" fill="#dcecf6"/><text x="55" y="143" font-size="24">真实泄漏</text><text x="55" y="178" font-size="17">接头 / 焊缝</text><rect x="260" y="90" width="200" height="110" rx="12" fill="#e4f1e6"/><text x="288" y="143" font-size="24">温度变化</text><text x="286" y="178" font-size="17">气体热胀冷缩</text><rect x="490" y="90" width="200" height="110" rx="12" fill="#fff0d9"/><text x="515" y="143" font-size="24">夹具容积</text><text x="515" y="178" font-size="17">软管与密封变形</text><rect x="720" y="90" width="210" height="110" rx="12" fill="#eee6f7"/><text x="742" y="143" font-size="24">仪器漂移</text><text x="742" y="178" font-size="17">零点 / 分辨力</text><path d="M130 205V260H825V205 M360 205V260 M590 205V260 M825 260V290" fill="none" stroke="#4e687d" stroke-width="4"/><rect x="245" y="290" width="470" height="90" rx="12" fill="#17324b"/><text x="310" y="325" font-size="23" fill="white">先排除干扰，再判定泄漏</text><text x="320" y="355" font-size="18" fill="#dbeaf2">记录压力、温度、时间与工装状态</text></svg>