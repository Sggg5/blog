<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#ffffff"/>
  <style>
    .t{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#16324f}
    .h{font-size:34px;font-weight:700}
    .s{font-size:20px;font-weight:600}
    .b{font-size:17px}
    .box{fill:#f7fafc;stroke:#6b879f;stroke-width:2;rx:16}
    .key{fill:#eef5fb;stroke:#2d6ea3;stroke-width:2;rx:16}
    .arr{stroke:#7b8fa1;stroke-width:3;fill:none;marker-end:url(#a)}
    .dash{stroke:#9aa9b5;stroke-width:2;stroke-dasharray:8 8;fill:none}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7b8fa1"/></marker></defs>
  <text x="60" y="62" class="t h">不锈钢抛光管：生产与检验闭环</text>
  <text x="60" y="98" class="t b">内抛与外抛不是最后一道“美容”，而是从制管质量开始控制的连续工艺。</text>

  <rect x="60" y="150" width="170" height="110" class="box"/>
  <text x="145" y="187" text-anchor="middle" class="t s">① 原料 / 管坯</text>
  <text x="145" y="218" text-anchor="middle" class="t b">牌号、壁厚、表面</text>
  <text x="145" y="244" text-anchor="middle" class="t b">划伤、凹坑、污染</text>

  <rect x="270" y="150" width="170" height="110" class="box"/>
  <text x="355" y="187" text-anchor="middle" class="t s">② 成形与焊接</text>
  <text x="355" y="218" text-anchor="middle" class="t b">焊缝成形、错边</text>
  <text x="355" y="244" text-anchor="middle" class="t b">热变色、内焊道</text>

  <rect x="480" y="150" width="170" height="110" class="box"/>
  <text x="565" y="187" text-anchor="middle" class="t s">③ 热处理 / 矫直</text>
  <text x="565" y="218" text-anchor="middle" class="t b">按产品规范执行</text>
  <text x="565" y="244" text-anchor="middle" class="t b">控制氧化与变形</text>

  <rect x="690" y="150" width="190" height="110" class="key"/>
  <text x="785" y="187" text-anchor="middle" class="t s">④ 内壁分级抛光</text>
  <text x="785" y="218" text-anchor="middle" class="t b">粗磨 → 细磨 → 精抛</text>
  <text x="785" y="244" text-anchor="middle" class="t b">重点盯住纵焊缝区</text>

  <rect x="920" y="150" width="190" height="110" class="key"/>
  <text x="1015" y="187" text-anchor="middle" class="t s">⑤ 外壁抛光</text>
  <text x="1015" y="218" text-anchor="middle" class="t b">均匀纹路与光泽</text>
  <text x="1015" y="244" text-anchor="middle" class="t b">防过磨、烧伤、波纹</text>

  <path d="M230 205 H265" class="arr"/><path d="M440 205 H475" class="arr"/>
  <path d="M650 205 H685" class="arr"/><path d="M880 205 H915" class="arr"/>

  <rect x="60" y="330" width="230" height="110" class="key"/>
  <text x="175" y="367" text-anchor="middle" class="t s">⑥ 清洗 / 表面处理</text>
  <text x="175" y="398" text-anchor="middle" class="t b">去磨料、金属粉、油污</text>
  <text x="175" y="424" text-anchor="middle" class="t b">酸洗/钝化按规范选用</text>
  <path d="M1015 260 V295 H175 V325" class="arr"/>

  <rect x="350" y="330" width="190" height="110" class="box"/>
  <text x="445" y="367" text-anchor="middle" class="t s">⑦ 外观 / 内窥镜</text>
  <text x="445" y="398" text-anchor="middle" class="t b">漏抛、划伤、麻点</text>
  <text x="445" y="424" text-anchor="middle" class="t b">焊缝、残留物、污染</text>

  <rect x="600" y="330" width="190" height="110" class="box"/>
  <text x="695" y="367" text-anchor="middle" class="t s">⑧ Ra 粗糙度</text>
  <text x="695" y="398" text-anchor="middle" class="t b">按规定方向与截止值</text>
  <text x="695" y="424" text-anchor="middle" class="t b">记录单点结果与位置</text>

  <rect x="850" y="330" width="190" height="110" class="box"/>
  <text x="945" y="367" text-anchor="middle" class="t s">⑨ 尺寸 / 壁厚</text>
  <text x="945" y="398" text-anchor="middle" class="t b">外径、壁厚、圆度</text>
  <text x="945" y="424" text-anchor="middle" class="t b">防止局部过度磨削</text>

  <path d="M290 385 H345" class="arr"/><path d="M540 385 H595" class="arr"/><path d="M790 385 H845" class="arr"/>

  <rect x="215" y="515" width="770" height="115" class="key"/>
  <text x="600" y="553" text-anchor="middle" class="t s">质量判定：把“工艺参数”和“交付指标”分开</text>
  <text x="600" y="586" text-anchor="middle" class="t b">砂号、转速、进给、压力、磨料寿命 → 内部工艺控制</text>
  <text x="600" y="614" text-anchor="middle" class="t b">Ra 最大值、外观、洁净度、尺寸与文件要求 → 最终验收</text>
  <path d="M945 440 V475 H600 V510" class="arr"/>
</svg>