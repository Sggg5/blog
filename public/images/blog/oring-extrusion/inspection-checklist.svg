<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-label="O型圈高压损伤的工程排查与单向双向挡圈配置判断图"><rect width="1120" height="680" fill="#fff"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#23445f}.ttl{font-size:28px;fill:#16467a;font-weight:700}.head{font-size:22px;font-weight:700}.lab{font-size:18px}.small{font-size:16px;fill:#566d82}.box{fill:#f4f8fb;stroke:#8fa9bd;stroke-width:2}.focus{fill:#eaf3fb;stroke:#477da4;stroke-width:2}.line{stroke:#7a99b1;stroke-width:3;fill:none}.rubber{fill:#293e50}.ptfe{fill:#b8d0e5;stroke:#4078a2;stroke-width:2}</style><text class="ttl" x="42" y="49">看到密封圈缺口，先追溯间隙和压力路径</text><text class="small" x="42" y="80">单向/双向压力仅作结构判断示意；最终配置须结合制造商工艺数据与实际产品标准。</text><rect class="focus" x="268" y="109" width="584" height="73" rx="14"/><text class="head" x="560" y="154" text-anchor="middle">拆检：损伤是否位于低压侧、靠近金属配合间隙？</text><path class="line" d="M560 182v42M228 224h664M228 224v26M560 224v26M892 224v26"/><rect class="box" x="43" y="251" width="370" height="153" rx="14"/><rect class="box" x="443" y="251" width="234" height="153" rx="14"/><rect class="box" x="707" y="251" width="370" height="153" rx="14"/><text class="head" x="228" y="289" text-anchor="middle">压力 / 间隙</text><text class="lab" x="65" y="325">最高压力及瞬态冲击</text><text class="lab" x="65" y="356">最大工作间隙、偏心、磨损</text><text class="head" x="560" y="289" text-anchor="middle">材料 / 温度</text><text class="lab" x="463" y="325">橡胶硬度与配方</text><text class="lab" x="463" y="356">实际介质及温度</text><text class="head" x="892" y="289" text-anchor="middle">装配 / 形貌</text><text class="lab" x="730" y="325">沟槽体积、锐边、划伤</text><text class="lab" x="730" y="356">啃伤、剪切、永久压痕</text><path class="line" d="M228 404v48h332M892 404v48H560M560 404v61"/><rect class="focus" x="280" y="466" width="560" height="65" rx="14"/><text class="head" x="560" y="508" text-anchor="middle">确定是否需要防挤出支撑及压力方向</text><rect class="box" x="45" y="555" width="499" height="87" rx="12"/><rect class="box" x="576" y="555" width="499" height="87" rx="12"/><text class="head" x="292" y="582" text-anchor="middle">单向压力</text><rect class="rubber" x="187" y="592" width="55" height="24" rx="12"/><rect class="ptfe" x="254" y="592" width="20" height="24" rx="3"/><text class="small" x="305" y="609">挡圈位于低压侧</text><text class="head" x="824" y="582" text-anchor="middle">压力可反向</text><rect class="ptfe" x="685" y="592" width="20" height="24" rx="3"/><rect class="rubber" x="714" y="592" width="55" height="24" rx="12"/><rect class="ptfe" x="778" y="592" width="20" height="24" rx="3"/><text class="small" x="817" y="609">评估双侧支撑</text><text class="small" x="43" y="666">增加挡圈需同步复核槽宽、压缩率、填充率、安装方式及公差链，不能在原沟槽里硬塞。</text></svg>