<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" width="1120" height="590" role="img" aria-label="O型圈在密封间隙挤出与加入支撑环的结构对比"><rect width="1120" height="590" fill="#fff"/><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#23445f}.ttl{font-size:29px;font-weight:700;fill:#16467a}.head{font-size:23px;font-weight:700}.lab{font-size:19px}.sub{font-size:16px;fill:#627c94}.steel{fill:#e7edf3;stroke:#879bab;stroke-width:2}.edge{stroke:#7891a6;stroke-width:2}.rubber{fill:#283a4a;stroke:#121b24;stroke-width:2}.ptfe{fill:#a7c5e1;stroke:#356d98;stroke-width:2}.flow{stroke:#2d78b1;stroke-width:5;stroke-linecap:round;fill:none}.danger{stroke:#c65b4d;stroke-width:4;fill:none}</style><text class="ttl" x="40" y="52">高压挤出破坏：橡胶被推入密封间隙</text><text class="sub" x="42" y="82">结构概念图（不是按比例制造图纸；接触区、间隙及压力方向应按实际设备核对）</text><rect x="30" y="111" width="515" height="402" rx="18" fill="#f6f9fc" stroke="#d1dde8"/><rect x="575" y="111" width="515" height="402" rx="18" fill="#f6f9fc" stroke="#d1dde8"/><text x="288" y="151" class="head" text-anchor="middle">无防挤出支撑</text><text x="834" y="151" class="head" text-anchor="middle">低压侧加装支撑环</text><g><rect class="steel" x="76" y="227" width="420" height="77"/><path class="steel" d="M76 365h133v-64h150v64h137v86H76z"/><path class="rubber" d="M235 300c-7-38 20-56 53-56 35 0 56 26 49 57-7 32-29 48-53 48-31 0-52-19-49-49z"/><path fill="#283a4a" stroke="#121b24" stroke-width="2" d="M335 284q37-1 51 7t12 18q-13 6-23 0l-40-8z"/><path class="danger" d="M387 293l11 7-9 4 10 7-11 6"/><path class="flow" d="M100 205h128"/><path d="m215 195 17 10-17 10" fill="none" stroke="#2d78b1" stroke-width="5"/><text class="lab" x="90" y="191">压力 P</text><text class="lab" x="384" y="336" fill="#bb4e40">挤出与啃伤</text><path d="M390 347l-25-36" stroke="#c65b4d" stroke-width="2"/><path d="M408 351v-43" stroke="#3e6b8b" stroke-dasharray="4 4" stroke-width="2"/><text class="sub" x="382" y="374">间隙 g</text></g><g><rect class="steel" x="621" y="227" width="421" height="77"/><path class="steel" d="M621 365h129v-64h150v64h142v86H621z"/><path class="rubber" d="M780 301c-3-40 22-57 53-57s52 22 52 55-21 51-52 51-55-16-53-49z"/><path class="ptfe" d="M880 257h33v99h-33q11-51 0-99z"/><path class="flow" d="M643 205h128"/><path d="m756 195 17 10-17 10" fill="none" stroke="#2d78b1" stroke-width="5"/><text class="lab" x="637" y="190">压力 P</text><path d="M899 364l23 29" stroke="#356d98" stroke-width="2"/><text class="lab" x="903" y="418" fill="#316e9a">PTFE挡圈</text><text class="sub" x="906" y="442">桥接挤出间隙</text></g><text class="lab" x="46" y="546">关键：压力↑、间隙↑、温度↑、材料软化或偏心↑ → 挤出风险通常增大。</text><text class="sub" x="46" y="573">挡圈只提供机械支撑，不替代O型圈密封，也不修复结构尺寸错误。</text></svg>