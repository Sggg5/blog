<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-label="滚槽管端首件检验和异常处理流程图">
<rect width="1200" height="550" fill="#f4f7fa"/><rect x="30" y="30" width="1140" height="490" rx="25" fill="white" stroke="#d8e3eb" stroke-width="2"/>
<text x="70" y="89" font-size="34" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif" fill="#1a3d58">滚槽首件：六道质量关口</text>
<text x="70" y="127" font-size="20" font-family="Noto Sans CJK SC, sans-serif" fill="#547085">记录规格、外径体系、滚轮型号、实测值与操作者，禁止只凭“能装上”放行</text>
<g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
<rect x="60" y="180" width="332" height="100" rx="18" fill="#eaf4fa" stroke="#74a4c2" stroke-width="2"/><text x="226" y="220" font-size="26" font-weight="bold" fill="#1d5a7a">01 图纸与系统</text><text x="226" y="251" font-size="19" fill="#426b83">OGS / AGS / 专用槽型</text>
<rect x="434" y="180" width="332" height="100" rx="18" fill="#eaf4fa" stroke="#74a4c2" stroke-width="2"/><text x="600" y="220" font-size="26" font-weight="bold" fill="#1d5a7a">02 管端与滚轮</text><text x="600" y="251" font-size="19" fill="#426b83">外径·壁厚·垂直度·RX</text>
<rect x="808" y="180" width="332" height="100" rx="18" fill="#eaf4fa" stroke="#74a4c2" stroke-width="2"/><text x="974" y="220" font-size="26" font-weight="bold" fill="#1d5a7a">03 槽径与槽宽</text><text x="974" y="251" font-size="19" fill="#426b83">C 周向复测、A/B记录</text>
<rect x="60" y="342" width="332" height="100" rx="18" fill="#eef7f0" stroke="#8db79c" stroke-width="2"/><text x="226" y="383" font-size="26" font-weight="bold" fill="#286c48">04 密封座表面</text><text x="226" y="414" font-size="19" fill="#47775d">无压痕、划伤、杂质</text>
<rect x="434" y="342" width="332" height="100" rx="18" fill="#eef7f0" stroke="#8db79c" stroke-width="2"/><text x="600" y="383" font-size="26" font-weight="bold" fill="#286c48">05 扩口与试装</text><text x="600" y="414" font-size="19" fill="#47775d">F限值、卡箍键啮合</text>
<rect x="808" y="342" width="332" height="100" rx="18" fill="#fff3ed" stroke="#d99d76" stroke-width="2"/><text x="974" y="383" font-size="26" font-weight="bold" fill="#a35728">06 判定与隔离</text><text x="974" y="414" font-size="19" fill="#955f3d">异常停机、复测、追溯</text>
</g>
<g stroke="#6d90a8" stroke-width="4" fill="none"><path d="M395 230 H429"/><path d="M420 220 L430 230 L420 240"/><path d="M769 230 H803"/><path d="M794 220 L804 230 L794 240"/><path d="M974 284 V328 H226 V338"/><path d="M216 329 L226 339 L236 329"/><path d="M395 392 H429"/><path d="M420 382 L430 392 L420 402"/><path d="M769 392 H803"/><path d="M794 382 L804 392 L794 402"/></g>
<text x="70" y="484" font-size="18" font-family="Noto Sans CJK SC, sans-serif" fill="#7b8995">图示为质量管理建议流程，不代替适用产品标准、设计确认及试验验证。</text>
