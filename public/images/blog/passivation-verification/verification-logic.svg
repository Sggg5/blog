<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2;rx:16}.key{fill:#edf5fb;stroke:#2d6ea3;stroke-width:2;rx:16}.a{stroke:#7890a4;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7890a4"/></marker></defs><text x="60" y="62" class="t h">钝化后怎么验：先问“要证明什么”</text><text x="60" y="100" class="t b">ASTM A967/A967M-25列出的检验本质上是确认钝化效果，尤其针对污染铁和外来物。</text><rect x="70" y="160" width="250" height="125" class="key"/><text x="195" y="202" text-anchor="middle" class="t s">表面是否仍有污染铁？</text><text x="195" y="240" text-anchor="middle" class="t b">选择规范允许、适合材质</text><text x="195" y="268" text-anchor="middle" class="t b">和产品形状的定性方法</text><rect x="475" y="160" width="250" height="125" class="key"/><text x="600" y="202" text-anchor="middle" class="t s">表面是否洁净完整？</text><text x="600" y="240" text-anchor="middle" class="t b">外观 + 清洁状态</text><text x="600" y="268" text-anchor="middle" class="t b">不能只靠“亮不亮”判断</text><rect x="880" y="160" width="250" height="125" class="key"/><text x="1005" y="202" text-anchor="middle" class="t s">过程是否稳定可重复？</text><text x="1005" y="240" text-anchor="middle" class="t b">槽液、时间、温度</text><text x="1005" y="268" text-anchor="middle" class="t b">漂洗、批次与记录</text><rect x="150" y="385" width="900" height="175" class="box"/><text x="600" y="427" text-anchor="middle" class="t s">不要把“钝化合格”简化成单一现象</text><text x="205" y="472" class="t b">水浸、高湿、盐雾、硫酸铜、铁氰化物-硝酸、湿布、沸水浸泡等方法</text><text x="205" y="510" class="t b">在ASTM A967/A967M-25中属于可选的定性验证路径；实际采用哪一种应由规范/合同指定。</text><path d="M195 285V345H600V380" class="a"/><path d="M600 285V380" class="a"/><path d="M1005 285V345H600V380" class="a"/><text x="60" y="635" class="t b">工程建议：产品图纸/检验规范中写清“处理方法 + 验证方法 + 接受准则”，不要只写“做钝化”。</text></svg>