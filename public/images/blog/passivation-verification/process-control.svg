<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2;rx:16}.key{fill:#edf5fb;stroke:#2d6ea3;stroke-width:2;rx:16}.a{stroke:#7890a4;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7890a4"/></marker></defs><text x="60" y="62" class="t h">不锈钢钝化：真正受控的是“洁净表面 → 化学处理 → 验证”</text><text x="60" y="100" class="t b">钝化不是把焊接氧化皮直接“盖住”，前处理是否到位决定后续处理是否有效。</text><rect x="60" y="165" width="200" height="125" class="box"/><text x="160" y="205" text-anchor="middle" class="t s">① 去油与清洗</text><text x="160" y="240" text-anchor="middle" class="t b">油脂、抛光蜡</text><text x="160" y="268" text-anchor="middle" class="t b">颗粒与加工残留</text><rect x="330" y="165" width="200" height="125" class="box"/><text x="430" y="205" text-anchor="middle" class="t s">② 去氧化皮</text><text x="430" y="240" text-anchor="middle" class="t b">焊接热变色、氧化层</text><text x="430" y="268" text-anchor="middle" class="t b">需要时先酸洗/除鳞</text><rect x="600" y="165" width="200" height="125" class="key"/><text x="700" y="205" text-anchor="middle" class="t s">③ 钝化处理</text><text x="700" y="240" text-anchor="middle" class="t b">按规范选择化学体系</text><text x="700" y="268" text-anchor="middle" class="t b">控制时间、温度、浓度</text><rect x="870" y="165" width="200" height="125" class="key"/><text x="970" y="205" text-anchor="middle" class="t s">④ 充分漂洗</text><text x="970" y="240" text-anchor="middle" class="t b">终止化学反应</text><text x="970" y="268" text-anchor="middle" class="t b">避免酸液与盐类残留</text><path d="M260 228H325" class="a"/><path d="M530 228H595" class="a"/><path d="M800 228H865" class="a"/><rect x="160" y="390" width="880" height="175" class="box"/><text x="600" y="430" text-anchor="middle" class="t s">⑤ 结果验证：不能只看“颜色变白了”</text><text x="225" y="478" class="t b">• 外观：无明显锈、氧化皮、蚀坑、化学残留</text><text x="225" y="512" class="t b">• 污染铁：按合同/规范选用适用的定性检验</text><text x="650" y="478" class="t b">• 漂洗：关注内腔、盲区和低点残液</text><text x="650" y="512" class="t b">• 记录：槽液、时间、温度、批次、检验结果可追溯</text><path d="M970 290V350H600V385" class="a"/><text x="60" y="640" class="t b">核心：清洗、除鳞/酸洗、钝化是不同任务；是否组合使用取决于产品状态和技术规范。</text></svg>