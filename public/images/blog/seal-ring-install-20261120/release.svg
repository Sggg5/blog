<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360"><rect width="1080" height="360" fill="#f4f7fa"/><text x="35" y="48" font-size="27" fill="#17364c">密封圈装配首件放行闭环</text><g font-size="21" text-anchor="middle" fill="#17364c"><rect x="25" y="100" width="185" height="100" rx="12" fill="#dcecf3"/><text x="118" y="145">清洁沟槽</text><text x="118" y="175">核对圈号</text><rect x="245" y="100" width="185" height="100" rx="12" fill="#dcecf3"/><text x="338" y="145">均匀装圈</text><text x="338" y="175">检查扭曲</text><rect x="465" y="100" width="185" height="100" rx="12" fill="#dcecf3"/><text x="558" y="145">插管与压接</text><text x="558" y="175">记录参数</text><rect x="685" y="100" width="185" height="100" rx="12" fill="#dcecf3"/><text x="778" y="145">外观及密封</text><text x="778" y="175">功能验证</text><rect x="905" y="100" width="150" height="100" rx="12" fill="#d5e8d4"/><text x="980" y="145">授权放行</text><text x="980" y="175">批次追溯</text></g><g stroke="#567b91" stroke-width="4"><path d="M210 150H245M430 150H465M650 150H685M870 150H905"/></g><text x="40" y="265" font-size="21" fill="#9a4d24">发现切伤、脱槽、翻卷或试验异常：停线 → 隔离 → 复核 → 重做首件</text><text x="40" y="312" font-size="18" fill="#526b7a">示意流程，具体试验条件与合格准则由适用标准及受控工艺确定</text></svg>