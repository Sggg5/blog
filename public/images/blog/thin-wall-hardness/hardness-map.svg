<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="white"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2}.key{fill:#edf5fb;stroke:#2d6ea3;stroke-width:2}.a{stroke:#2d6ea3;stroke-width:3;fill:none}</style><text x="60" y="62" class="t h">薄壁不锈钢管硬度：测点位置比“测一个数”更重要</text><text x="60" y="100" class="t b">弯曲、扩口、缩径、水涨等冷加工会造成局部加工硬化，测点应对应制造过程。</text><rect x="60" y="150" width="1080" height="390" rx="18" class="box"/><ellipse cx="600" cy="345" rx="370" ry="145" fill="#e9eef2" stroke="#61788d" stroke-width="28"/><ellipse cx="600" cy="345" rx="315" ry="100" fill="white" stroke="#a3b1bd" stroke-width="2"/><circle cx="280" cy="290" r="13" fill="#2d6ea3"/><circle cx="600" cy="205" r="13" fill="#2d6ea3"/><circle cx="920" cy="290" r="13" fill="#2d6ea3"/><circle cx="600" cy="485" r="13" fill="#2d6ea3"/><text x="235" y="260" class="t b">母材区</text><text x="535" y="180" class="t b">焊缝/热影响区附近</text><text x="920" y="260" class="t b">成形高应变区</text><text x="535" y="520" class="t b">对称参考点</text><path d="M260 575 H940" class="a"/><text x="600" y="610" text-anchor="middle" class="t s">同一零件建立“位置—硬度”分布，比单点硬度更能解释工艺变化</text><text x="600" y="650" text-anchor="middle" class="t b">截面测量时需保证制样平整、压痕间距合理，并按规定试验力与方法报告HV值。</text></svg>