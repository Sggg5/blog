<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="white"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:20px;font-weight:600}.b{font-size:16px}.box{fill:#f7fafc;stroke:#7890a4;stroke-width:2}.key{fill:#edf5fb;stroke:#2d6ea3;stroke-width:2}.arr{stroke:#7890a4;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7890a4"/></marker></defs><text x="60" y="62" class="t h">薄壁管硬度异常：先判断“材料变了”还是“测法变了”</text><rect x="80" y="130" width="220" height="100" rx="14" class="key"/><text x="190" y="170" text-anchor="middle" class="t s">发现HV偏高/偏低</text><text x="190" y="202" text-anchor="middle" class="t b">不要先下材料结论</text><rect x="370" y="130" width="220" height="100" rx="14" class="box"/><text x="480" y="170" text-anchor="middle" class="t s">检查试验条件</text><text x="480" y="202" text-anchor="middle" class="t b">试验力、表面、压痕读数</text><rect x="660" y="130" width="220" height="100" rx="14" class="box"/><text x="770" y="170" text-anchor="middle" class="t s">检查取样位置</text><text x="770" y="202" text-anchor="middle" class="t b">母材/焊缝/冷加工区</text><rect x="950" y="130" width="170" height="100" rx="14" class="box"/><text x="1035" y="170" text-anchor="middle" class="t s">复测</text><text x="1035" y="202" text-anchor="middle" class="t b">同法、同位置</text><path d="M300 180H365" class="arr"/><path d="M590 180H655" class="arr"/><path d="M880 180H945" class="arr"/><rect x="130" y="330" width="280" height="140" rx="14" class="box"/><text x="270" y="370" text-anchor="middle" class="t s">若差异随位置变化</text><text x="270" y="405" text-anchor="middle" class="t b">优先分析冷作硬化、焊接热史</text><text x="270" y="435" text-anchor="middle" class="t b">成形量、固溶状态和工序变化</text><rect x="460" y="330" width="280" height="140" rx="14" class="box"/><text x="600" y="370" text-anchor="middle" class="t s">若差异随测法变化</text><text x="600" y="405" text-anchor="middle" class="t b">优先检查制样、试验力</text><text x="600" y="435" text-anchor="middle" class="t b">压痕尺寸、读数和设备验证</text><rect x="790" y="330" width="280" height="140" rx="14" class="key"/><text x="930" y="370" text-anchor="middle" class="t s">形成工艺基线</text><text x="930" y="405" text-anchor="middle" class="t b">规格+工序+位置+HV方法</text><text x="930" y="435" text-anchor="middle" class="t b">再做批次趋势和异常判定</text><path d="M1035 230V280H270V325" class="arr"/><path d="M1035 280H600V325" class="arr"/><path d="M410 400H455" class="arr"/><path d="M740 400H785" class="arr"/><text x="600" y="570" text-anchor="middle" class="t s">关键：硬度是“材料状态 + 制造历史 + 测量方法”的共同结果</text><text x="600" y="615" text-anchor="middle" class="t b">不要把不同试验力、不同位置、不同表面状态得到的数值直接混成一条趋势。</text></svg>