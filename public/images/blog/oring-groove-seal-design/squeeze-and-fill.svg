<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-label="O型圈压缩率与沟槽填充率的几何示意"><rect width="1120" height="610" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#27425c}.title{font-size:30px;font-weight:700;fill:#184e83}.label{font-size:21px;font-weight:600}.detail{font-size:19px}.note{font-size:16px;fill:#597185}.blue{stroke:#316c9b;stroke-width:3;fill:none}.metal{fill:#d9e3ec;stroke:#7994ad;stroke-width:3}.rubber{fill:#26384c;stroke:#0e2436;stroke-width:3}</style><text x="45" y="55" class="title">沟槽深度控制初始压缩，沟槽宽度决定侧向容积</text><rect x="40" y="92" width="678" height="405" rx="16" fill="#f4f8fc" stroke="#d4e1ee"/><text x="65" y="135" class="label">示意：受约束的静态端面密封</text><path d="M142 231 H610 V260 H537 V417 H214 V260 H142 Z" class="metal"/><rect x="142" y="204" width="468" height="27" rx="4" class="metal"/><ellipse cx="377" cy="323" rx="130" ry="93" class="rubber"/><path d="M214 417H537" class="blue"/><path d="M660 231V417M649 231h22M649 417h22" class="blue"/><text x="679" y="330" font-size="22" fill="#235883" text-anchor="middle">t</text><path d="M214 466H537M214 454v23M537 454v23" class="blue"/><text x="375" y="493" class="label" text-anchor="middle">b</text><text x="67" y="530" class="detail">d₂ 为未压缩线径，t 为安装后的有效密封高度</text><rect x="751" y="92" width="328" height="405" rx="16" fill="#eef5fb" stroke="#c5d9e8"/><text x="776" y="137" class="label">核心计算</text><text x="776" y="194" class="detail">压缩率 ε = (d₂ − t) / d₂</text><path d="M773 210h284" stroke="#b0c6d8" stroke-width="2"/><text x="776" y="254" class="detail">示例：d₂ = 3.0 mm</text><text x="776" y="289" class="detail">t = 2.4 mm</text><text x="776" y="328" class="label">ε = 20%</text><path d="M773 345h284" stroke="#b0c6d8" stroke-width="2"/><text x="776" y="385" class="detail">近似填充率：</text><text x="776" y="421" class="detail">πd₂² / (4bt)</text><text x="776" y="463" class="label">b=4.0 时约 74%</text><text x="45" y="576" class="note">工程示意与假设计算：不代表ISO 3601标准尺寸；实际应核对公差、沟槽圆角、安装伸长、介质膨胀及温度。</text></svg>