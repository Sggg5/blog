<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="635" viewBox="0 0 1120 635" role="img" aria-label="O型圈低压渗漏及高压挤出风险的排查逻辑"><rect width="1120" height="635" fill="white"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#2b465d}.title{font-size:29px;font-weight:700;fill:#184e83}.label{font-size:21px;font-weight:600}.body{font-size:19px}.caption{font-size:16px;fill:#647c90}.card{fill:#f2f7fb;stroke:#aec6dc;stroke-width:2}.head{fill:#e4eff8;stroke:#397bac;stroke-width:2}.arr{stroke:#678cab;stroke-width:3;fill:none}</style><text x="50" y="58" class="title">同一密封结构，低压与高压异常的检查重点不同</text><rect x="335" y="90" width="450" height="78" rx="12" class="head"/><text x="560" y="123" class="label" text-anchor="middle">记录异常工况、泄漏位置与状态</text><text x="560" y="150" class="body" text-anchor="middle">先排除装配损伤与异物</text><path d="M560 168V195M237 195H883M237 195V222M883 195V222" class="arr"/><rect x="50" y="224" width="502" height="252" rx="12" class="card"/><rect x="568" y="224" width="502" height="252" rx="12" class="card"/><text x="301" y="272" text-anchor="middle" class="label">低压渗漏：先查接触密封</text><text x="77" y="320" class="body">① 装配后有效压缩率是否足够</text><text x="77" y="359" class="body">② 槽深、线径、公差叠加与偏心</text><text x="77" y="398" class="body">③ 扭曲、划伤、表面刀痕、污染</text><text x="77" y="437" class="body">④ 卸载后回弹、压缩永久变形</text><text x="819" y="272" text-anchor="middle" class="label">高压失效：再查抗挤出能力</text><text x="592" y="320" class="body">① 密封间隙 g 与部件变形</text><text x="592" y="359" class="body">② 介质压力、硬度与温度</text><text x="592" y="398" class="body">③ 槽内填充率与介质膨胀</text><text x="592" y="437" class="body">④ 必要时评估支撑环方案</text><path d="M301 476V512H560M819 476V512H560V535" class="arr"/><rect x="143" y="538" width="834" height="58" rx="12" class="head"/><text x="560" y="576" class="label" text-anchor="middle">最终：按具体工况建立尺寸极限 + 低压/高压 + 温度循环联合验证</text><text x="50" y="622" class="caption">工程排查建议；高压或特殊结构应按产品标准和密封供应商数据开展验证，不可直接套用通用沟槽表。</text></svg>