<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fbfd"/><text x="70" y="75" font-family="Arial,'Microsoft YaHei'" font-size="34" font-weight="700" fill="#134994">现场排查缝隙腐蚀，不要只盯材料牌号</text><text x="70" y="115" font-family="Arial,'Microsoft YaHei'" font-size="20" fill="#526b85">从结构、介质、表面和运行状态四条线同时检查</text><g font-family="Arial,'Microsoft YaHei'"><rect x="80" y="180" width="240" height="320" rx="18" fill="#eaf3fb" stroke="#b7d1e8"/><text x="115" y="230" font-size="28" font-weight="700" fill="#134994">① 结构缝隙</text><text x="115" y="285" font-size="21" fill="#263f55">• 垫片边缘</text><text x="115" y="330" font-size="21" fill="#263f55">• 螺纹 / 搭接</text><text x="115" y="375" font-size="21" fill="#263f55">• 卡箍与密封面</text><text x="115" y="420" font-size="21" fill="#263f55">• 排水死角</text><rect x="350" y="180" width="240" height="320" rx="18" fill="#eef6f1" stroke="#bad9c5"/><text x="385" y="230" font-size="28" font-weight="700" fill="#236b45">② 介质条件</text><text x="385" y="285" font-size="21" fill="#263f55">• 氯离子来源</text><text x="385" y="330" font-size="21" fill="#263f55">• 温度与 pH</text><text x="385" y="375" font-size="21" fill="#263f55">• 消毒氧化剂</text><text x="385" y="420" font-size="21" fill="#263f55">• 蒸发浓缩</text><rect x="620" y="180" width="240" height="320" rx="18" fill="#fff5e9" stroke="#e9cfaa"/><text x="655" y="230" font-size="28" font-weight="700" fill="#a55a14">③ 表面状态</text><text x="655" y="285" font-size="21" fill="#263f55">• 焊接氧化皮</text><text x="655" y="330" font-size="21" fill="#263f55">• 铁污染</text><text x="655" y="375" font-size="21" fill="#263f55">• 粗糙划痕</text><text x="655" y="420" font-size="21" fill="#263f55">• 沉积物附着</text><rect x="890" y="180" width="240" height="320" rx="18" fill="#f7eef7" stroke="#d8bed8"/><text x="925" y="230" font-size="28" font-weight="700" fill="#754675">④ 运行状态</text><text x="925" y="285" font-size="21" fill="#263f55">• 长期滞水</text><text x="925" y="330" font-size="21" fill="#263f55">• 清洗不彻底</text><text x="925" y="375" font-size="21" fill="#263f55">• 频繁干湿循环</text><text x="925" y="420" font-size="21" fill="#263f55">• 局部高温</text><rect x="190" y="550" width="820" height="72" rx="16" fill="#134994"/><text x="300" y="596" font-size="25" font-weight="700" fill="white">核心思路：消除滞留缝隙 + 控制介质 + 保持洁净表面 + 合理选材</text></g></svg>