<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7fafc"/><text x="70" y="72" font-family="Arial,'Microsoft YaHei'" font-size="34" font-weight="700" fill="#134994">缝隙腐蚀：危险环境是在缝里逐渐形成的</text><text x="70" y="112" font-family="Arial,'Microsoft YaHei'" font-size="20" fill="#526b85">垫片、搭接、沉积物下方等狭窄区域，会限制氧的补充并形成局部浓差环境</text><rect x="90" y="195" width="1020" height="120" rx="8" fill="#dce6ef" stroke="#91a8bb" stroke-width="2"/><text x="130" y="265" font-family="Arial,'Microsoft YaHei'" font-size="28" font-weight="700" fill="#173b5e">垫片 / 沉积物 / 搭接件</text><rect x="90" y="430" width="1020" height="130" rx="8" fill="#d7e0e7" stroke="#91a8bb" stroke-width="2"/><text x="465" y="510" font-family="Arial,'Microsoft YaHei'" font-size="30" font-weight="700" fill="#173b5e">不锈钢基体</text><path d="M350 315 L850 315 L810 430 L390 430 Z" fill="#d9eef8" stroke="#4d87b8" stroke-width="3"/><text x="500" y="355" font-family="Arial,'Microsoft YaHei'" font-size="25" font-weight="700" fill="#134994">狭窄缝隙中的滞留液</text><text x="425" y="393" font-family="Arial,'Microsoft YaHei'" font-size="20" fill="#315a7b">氧补充受限 → 溶液组成与外部逐渐不同</text><circle cx="450" cy="420" r="11" fill="#e74c3c"/><circle cx="505" cy="420" r="11" fill="#e74c3c"/><circle cx="560" cy="420" r="11" fill="#e74c3c"/><text x="420" y="608" font-family="Arial,'Microsoft YaHei'" font-size="22" fill="#173b5e">缝内：钝化膜稳定性下降，金属溶解后局部 pH 降低，Cl⁻ 迁入并富集</text><path d="M935 355 C1010 350 1035 385 1010 420" fill="none" stroke="#2477c5" stroke-width="4" marker-end="url(#a)"/><text x="910" y="340" font-family="Arial,'Microsoft YaHei'" font-size="21" fill="#2477c5">外部富氧区</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2477c5"/></marker></defs></svg>