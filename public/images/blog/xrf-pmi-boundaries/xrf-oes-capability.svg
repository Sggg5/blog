<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="XRF与OES在不锈钢牌号识别中的能力边界">
<rect width="1200" height="530" fill="#f3f6fa"/><rect x="38" y="35" width="1124" height="460" rx="20" fill="#fff" stroke="#dce5ee"/>
<text x="72" y="92" font-size="31" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-weight="bold" fill="#173c67">不同任务，选择不同的检测方法</text>
<text x="72" y="132" font-size="18" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#586e83">仅为工程选型示意；最终能力取决于仪器配置、校准及验证范围</text>
<rect x="70" y="167" width="245" height="70" rx="12" fill="#e9eff7"/><text x="95" y="210" font-size="24" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#23496c">检测目标</text>
<rect x="333" y="167" width="368" height="70" rx="12" fill="#dceafa"/><text x="360" y="210" font-size="24" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1b4d86">手持XRF</text>
<rect x="719" y="167" width="406" height="70" rx="12" fill="#dcf3eb"/><text x="745" y="210" font-size="24" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#196b55">火花OES / 经验证的含碳方法</text>
<g font-size="22" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#263e55">
<text x="92" y="286">304 与 316</text><text x="358" y="286">Cr / Ni / Mo 筛查较适合</text><text x="745" y="286">可用于成分复核</text>
<text x="92" y="350">304 与 304L</text><text x="358" y="350">不能靠XRF判定低碳</text><text x="745" y="350">需要验证碳含量</text>
<text x="92" y="414">201 与 304</text><text x="358" y="414">结合 Mn / Ni 等筛查</text><text x="745" y="414">疑难样品可进一步分析</text>
</g>
<g stroke="#e1e8f0" stroke-width="2"><path d="M70 303H1125M70 367H1125M315 237V448M701 237V448"/></g>
<text x="72" y="470" font-size="18" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#5a6c7e">“屏幕自动匹配牌号” ≠ “所有规定元素均已验证合格”</text>
</svg>