<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4f9"/></linearGradient><style>.title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.sub{font:400 17px Arial,'Microsoft YaHei',sans-serif;fill:#5e7083}.h{font:700 19px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.b{font:400 15px Arial,'Microsoft YaHei',sans-serif;fill:#40566f}.tag{font:700 16px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.sum{font:700 21px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}</style></defs><rect width="1200" height="720" rx="24" fill="url(#bg)"/><text x="600" y="55" text-anchor="middle" class="title">现场哪些条件会把点蚀风险放大？</text><text x="600" y="86" text-anchor="middle" class="sub">点蚀通常不是单一因素造成，而是“介质 + 温度 + 表面状态 + 流动/滞留”叠加的结果。</text><g transform="translate(65 130)"><rect width="250" height="205" rx="18" fill="#eef6fc" stroke="#c8dceb"/><rect width="250" height="50" rx="18" fill="#176fc4"/><text x="125" y="33" text-anchor="middle" class="tag">氯离子 / 卤素介质</text><text x="22" y="88" class="b">海盐、含氯水、清洗剂残留等</text><text x="22" y="116" class="b">会提高局部钝化膜失稳概率。</text><text x="22" y="154" class="h">现场关注</text><text x="22" y="183" class="b">介质来源、浓缩、蒸发、残留。</text></g><g transform="translate(345 130)"><rect width="250" height="205" rx="18" fill="#eef6fc" stroke="#c8dceb"/><rect width="250" height="50" rx="18" fill="#4f83b6"/><text x="125" y="33" text-anchor="middle" class="tag">温度升高</text><text x="22" y="88" class="b">温度越高，很多含氯环境对不锈钢</text><text x="22" y="116" class="b">的局部腐蚀攻击性越强。</text><text x="22" y="154" class="h">现场关注</text><text x="22" y="183" class="b">热水、换热区、焊后高温表面。</text></g><g transform="translate(625 130)"><rect width="250" height="205" rx="18" fill="#eef6fc" stroke="#c8dceb"/><rect width="250" height="50" rx="18" fill="#6c86a0"/><text x="125" y="33" text-anchor="middle" class="tag">滞水 / 沉积物 / 缝隙</text><text x="22" y="88" class="b">低流速、死角、沉积物覆盖会形成</text><text x="22" y="116" class="b">局部浓差环境和污染物富集。</text><text x="22" y="154" class="h">现场关注</text><text x="22" y="183" class="b">排水、坡度、垫片边缘、沉积区。</text></g><g transform="translate(905 130)"><rect width="230" height="205" rx="18" fill="#fff0ee" stroke="#efc6bf"/><rect width="230" height="50" rx="18" fill="#d45a49"/><text x="115" y="33" text-anchor="middle" class="tag">表面状态差</text><text x="22" y="88" class="b">粗糙打磨、铁污染、热着色、夹杂</text><text x="22" y="116" class="b">等都会增加局部薄弱点。</text><text x="22" y="154" class="h">现场关注</text><text x="22" y="183" class="b">清洁度、粗糙度、焊后处理。</text></g><rect x="70" y="385" width="1060" height="215" rx="22" fill="#fff" stroke="#d0dde9"/><text x="110" y="430" class="h">现场排查顺序</text><g transform="translate(110 465)"><circle cx="30" cy="30" r="28" fill="#176fc4"/><text x="30" y="37" text-anchor="middle" class="tag">1</text><text x="70" y="25" class="h">看位置</text><text x="70" y="50" class="b">是否集中在焊缝、缝隙、沉积物下、滞水点？</text></g><g transform="translate(385 465)"><circle cx="30" cy="30" r="28" fill="#176fc4"/><text x="30" y="37" text-anchor="middle" class="tag">2</text><text x="70" y="25" class="h">看介质</text><text x="70" y="50" class="b">有没有含氯水、盐分、清洗剂或蒸发浓缩？</text></g><g transform="translate(675 465)"><circle cx="30" cy="30" r="28" fill="#176fc4"/><text x="30" y="37" text-anchor="middle" class="tag">3</text><text x="70" y="25" class="h">看表面</text><text x="70" y="50" class="b">有无热着色、污染、深划痕、粗糙打磨？</text></g><g transform="translate(945 465)"><circle cx="30" cy="30" r="28" fill="#d45a49"/><text x="30" y="37" text-anchor="middle" class="tag">4</text><text x="70" y="25" class="h">再看牌号</text><text x="70" y="50" class="b">环境超过材料能力时，再考虑更耐点蚀的牌号。</text></g><rect x="90" y="630" width="1020" height="54" rx="18" fill="#edf4fb"/><text x="600" y="664" text-anchor="middle" class="sum">不要只问“是不是304不行”，先确认环境和表面状态是否把局部腐蚀条件凑齐了。</text></svg>