<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-label="水涨成形内压与轴向补料匹配示意">
<rect width="960" height="450" fill="#fff"/>
<text x="42" y="50" font-family="Noto Sans CJK SC,Arial" font-size="28" font-weight="bold" fill="#244e75">水涨成形：内压与轴向补料需要匹配</text>
<text x="42" y="82" font-family="Noto Sans CJK SC,Arial" font-size="18" fill="#62788a">定性工艺窗口示意，非实际压力曲线或通用工艺参数</text>
<rect x="58" y="115" width="840" height="276" rx="14" fill="#f4f8fb" stroke="#d6e2ed"/>
<line x1="132" y1="350" x2="838" y2="350" stroke="#53718a" stroke-width="3"/>
<line x1="132" y1="350" x2="132" y2="143" stroke="#53718a" stroke-width="3"/>
<text x="435" y="417" font-family="Noto Sans CJK SC,Arial" font-size="21" fill="#244e75">轴向补料量（定性增加 →）</text>
<text x="70" y="240" font-family="Noto Sans CJK SC,Arial" font-size="19" fill="#244e75" transform="rotate(-90 70 240)">内压（定性增加 →）</text>
<path d="M 220 295 Q 310 245 470 230 Q 630 212 735 195" fill="none" stroke="#3e799e" stroke-width="50" opacity=".18"/>
<path d="M 220 295 Q 310 245 470 230 Q 630 212 735 195" fill="none" stroke="#3e799e" stroke-width="3" stroke-dasharray="9 7"/>
<text x="417" y="214" font-family="Noto Sans CJK SC,Arial" font-size="22" font-weight="bold" fill="#285c7d">可试验的匹配区</text>
<text x="205" y="177" font-family="Noto Sans CJK SC,Arial" font-size="20" fill="#a45d50">高压 / 补料不足：局部减薄、开裂风险</text>
<text x="555" y="320" font-family="Noto Sans CJK SC,Arial" font-size="20" fill="#a45d50">补料偏多 / 压力不足：起皱风险</text>
</svg>