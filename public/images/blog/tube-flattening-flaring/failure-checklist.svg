<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="不锈钢焊管压扁和扩口异常排查流程"><rect width="1120" height="600" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#23405c}.h{font-size:30px;font-weight:bold;fill:#174b83}.t{font-size:21px;font-weight:bold}.s{font-size:17px}.box{fill:#f3f7fb;stroke:#96b0c8;stroke-width:2}.key{fill:#e5f0fa;stroke:#3475a8;stroke-width:2}</style><text x="45" y="60" class="h">压扁、扩口异常：从裂纹位置倒查工艺</text><text x="46" y="95" class="s">试验失败先保留原件，确认标准规定的试验终点，不能直接把裂纹归因于材料或焊缝。</text><rect class="key" x="55" y="138" width="1010" height="72" rx="13"/><text x="560" y="182" text-anchor="middle" class="t">先核实：试验方法、试样长度、焊缝方位、工装对中、规定变形终点</text><path d="M560 210V246" stroke="#3475a8" stroke-width="3"/><path d="M552 236l8 13 8-13" fill="none" stroke="#3475a8" stroke-width="3"/><rect class="box" x="55" y="256" width="312" height="160" rx="13"/><rect class="box" x="404" y="256" width="312" height="160" rx="13"/><rect class="box" x="753" y="256" width="312" height="160" rx="13"/><text x="211" y="300" text-anchor="middle" class="t">焊缝附近开裂</text><text x="76" y="339" class="s">核查焊接缺欠与内外焊道</text><text x="76" y="371" class="s">对照截面、硬度与热处理</text><text x="560" y="300" text-anchor="middle" class="t">远离焊缝的母材开裂</text><text x="425" y="339" class="s">核查冷加工、壁厚、划伤</text><text x="425" y="371" class="s">对照炉批、硬度与延性</text><text x="909" y="300" text-anchor="middle" class="t">扩口端缘首先开裂</text><text x="774" y="339" class="s">核查毛刺、切口刀痕、润滑</text><text x="774" y="371" class="s">对照芯棒角度、同轴度</text><path d="M211 416v37h349v28M560 416v65M909 416v37H560" stroke="#7592aa" stroke-width="3" fill="none"/><rect class="key" x="180" y="482" width="760" height="72" rx="13"/><text x="560" y="523" text-anchor="middle" class="t">关联批次 / 设备 / 制管参数，按产品标准决定复验与处置</text><text x="55" y="584" class="s">工程排查示意：裂纹位置只能提示优先方向，不能替代断口、金相或规定试验判定。</text></svg>