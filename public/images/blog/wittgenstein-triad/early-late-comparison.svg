<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">维特根斯坦早期与后期思想对照</title><desc id="d">早期关注命题如何描绘事实，后期关注语言在生活活动中的使用。</desc>
<rect width="1200" height="560" rx="26" fill="#f8fafc"/>
<text x="60" y="62" font-size="28" font-family="sans-serif" font-weight="700" fill="#172b4d">从图像理论到语言游戏</text>
<g font-family="sans-serif">
  <rect x="60" y="112" width="500" height="350" rx="22" fill="#eaf2fb" stroke="#93c5fd" stroke-width="2"/>
  <text x="95" y="164" font-size="27" font-weight="700" fill="#1e3a8a">早期：《逻辑哲学论》</text>
  <rect x="105" y="205" width="180" height="76" rx="14" fill="#fff" stroke="#93c5fd"/>
  <text x="195" y="252" font-size="21" text-anchor="middle" fill="#1e40af">可能事实</text>
  <path d="M295 243 H355" stroke="#64748b" stroke-width="3"/>
  <path d="M345 233 L359 243 L345 253" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="370" y="205" width="150" height="76" rx="14" fill="#fff" stroke="#93c5fd"/>
  <text x="445" y="252" font-size="21" text-anchor="middle" fill="#1e40af">命题图像</text>
  <text x="105" y="333" font-size="18" fill="#334155">关注：逻辑形式、真值条件、</text>
  <text x="105" y="365" font-size="18" fill="#334155">什么能够说，以及什么只能显示。</text>
  <text x="105" y="420" font-size="16" fill="#64748b">关键词：事实｜图像｜逻辑｜边界</text>

  <rect x="640" y="112" width="500" height="350" rx="22" fill="#eef7f2" stroke="#86c5a5" stroke-width="2"/>
  <text x="675" y="164" font-size="27" font-weight="700" fill="#14532d">后期：《哲学研究》</text>
  <rect x="685" y="205" width="180" height="76" rx="14" fill="#fff" stroke="#86c5a5"/>
  <text x="775" y="252" font-size="21" text-anchor="middle" fill="#166534">具体活动</text>
  <path d="M875 243 H935" stroke="#64748b" stroke-width="3"/>
  <path d="M925 233 L939 243 L925 253" fill="none" stroke="#64748b" stroke-width="3"/>
  <rect x="950" y="205" width="150" height="76" rx="14" fill="#fff" stroke="#86c5a5"/>
  <text x="1025" y="252" font-size="21" text-anchor="middle" fill="#166534">语言使用</text>
  <text x="685" y="333" font-size="18" fill="#334155">关注：语言游戏、规则、家族相似，</text>
  <text x="685" y="365" font-size="18" fill="#334155">词语在日常实践中如何获得意义。</text>
  <text x="685" y="420" font-size="16" fill="#64748b">关键词：使用｜语境｜规则｜生活形式</text>
</g>
<text x="600" y="510" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#475569">不是简单地“前后相反”，而是研究重心与方法发生了转变</text>
</svg>