<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">早期维特根斯坦思想链条</title><desc id="d">从世界中的事实，经思想图像和命题表达，到语言边界的四步关系。</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#64748b"/></marker>
  <linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#e7eef5"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
</defs>
<rect width="1200" height="470" rx="26" fill="#f8fafc"/>
<text x="60" y="62" font-size="28" font-family="sans-serif" font-weight="700" fill="#172b4d">早期思想：世界如何进入语言</text>
<g font-family="sans-serif" text-anchor="middle">
  <rect x="55" y="132" width="230" height="190" rx="20" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="170" y="184" font-size="25" font-weight="700" fill="#1e293b">世界</text>
  <text x="170" y="226" font-size="19" fill="#334155">实际成立的事实</text>
  <text x="170" y="264" font-size="16" fill="#64748b">对象及其关系</text>

  <rect x="350" y="132" width="230" height="190" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="465" y="184" font-size="25" font-weight="700" fill="#1e3a8a">思想</text>
  <text x="465" y="226" font-size="19" fill="#1e40af">事实的逻辑图像</text>
  <text x="465" y="264" font-size="16" fill="#1d4ed8">把可能情形组织起来</text>

  <rect x="645" y="132" width="230" height="190" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="760" y="184" font-size="25" font-weight="700" fill="#0c4a6e">命题</text>
  <text x="760" y="226" font-size="19" fill="#075985">表达可能的事实</text>
  <text x="760" y="264" font-size="16" fill="#0369a1">具有真值条件</text>

  <rect x="940" y="132" width="205" height="190" rx="20" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1042" y="184" font-size="25" font-weight="700" fill="#1e293b">边界</text>
  <text x="1042" y="226" font-size="19" fill="#334155">说与显示</text>
  <text x="1042" y="264" font-size="16" fill="#64748b">语言并非万能</text>
</g>
<g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
  <path d="M292 227 H338"/><path d="M587 227 H633"/><path d="M882 227 H928"/>
</g>
<text x="600" y="390" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#475569">教学性归纳：不是维特根斯坦本人提出的正式“三段论”</text>
</svg>