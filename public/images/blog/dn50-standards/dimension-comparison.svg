<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4f9"/></linearGradient>
    <radialGradient id="steel" cx="35%" cy="25%" r="75%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d9e0e6"/><stop offset="0.8" stop-color="#aeb9c4"/><stop offset="1" stop-color="#7c8996"/></radialGradient>
    <style>.title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#123f75}.sub{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#5b6f84}.h{font:700 22px 'Microsoft YaHei',Arial,sans-serif;fill:#123f75}.big{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#0d5fab}.b{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#40566e}.note{font:400 15px 'Microsoft YaHei',Arial,sans-serif;fill:#6b7b8c}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="title">同样写着“50”，为什么外径会不同？</text>
  <text x="600" y="90" text-anchor="middle" class="sub">“50”是各自体系里的公称/系列标识，不等于共同约定的实际外径。</text>
  <g transform="translate(90,150)"><rect width="300" height="430" rx="20" fill="#fff" stroke="#cedae6" stroke-width="2"/><text x="150" y="48" text-anchor="middle" class="h">日本 JIS G 3448</text><text x="150" y="78" text-anchor="middle" class="b">50Su</text><circle cx="150" cy="215" r="97" fill="url(#steel)" stroke="#788795" stroke-width="4"/><circle cx="150" cy="215" r="82" fill="#f6f9fb" stroke="#9faab4" stroke-width="2"/><text x="150" y="226" text-anchor="middle" class="big">48.6 mm</text><text x="150" y="340" text-anchor="middle" class="b">Su 是日本普通配管用薄壁</text><text x="150" y="366" text-anchor="middle" class="b">不锈钢管的独立尺寸标识</text><text x="150" y="405" text-anchor="middle" class="note">50Su 不能直接当成国际通用 DN50</text></g>
  <g transform="translate(450,150)"><rect width="300" height="430" rx="20" fill="#fff" stroke="#cedae6" stroke-width="2"/><text x="150" y="48" text-anchor="middle" class="h">欧洲 EN 10312</text><text x="150" y="78" text-anchor="middle" class="b">DN50 常见外径</text><circle cx="150" cy="215" r="108" fill="url(#steel)" stroke="#788795" stroke-width="4"/><circle cx="150" cy="215" r="92" fill="#f6f9fb" stroke="#9faab4" stroke-width="2"/><text x="150" y="226" text-anchor="middle" class="big">54 mm</text><text x="150" y="340" text-anchor="middle" class="b">15 / 18 / 22 / 28 / 35 / 42 / 54</text><text x="150" y="366" text-anchor="middle" class="b">属于典型欧洲公制尺寸序列</text><text x="150" y="405" text-anchor="middle" class="note">54 mm 也常见于欧洲铜管压接生态</text></g>
  <g transform="translate(810,150)"><rect width="300" height="430" rx="20" fill="#fff" stroke="#cedae6" stroke-width="2"/><text x="150" y="48" text-anchor="middle" class="h">中国 GB/T 19228</text><text x="150" y="78" text-anchor="middle" class="b">DN50 保留两套系列</text><circle cx="118" cy="210" r="82" fill="url(#steel)" stroke="#788795" stroke-width="4"/><circle cx="118" cy="210" r="68" fill="#f6f9fb" stroke="#9faab4" stroke-width="2"/><circle cx="218" cy="210" r="88" fill="url(#steel)" stroke="#788795" stroke-width="4" opacity="0.96"/><circle cx="218" cy="210" r="73" fill="#f6f9fb" stroke="#9faab4" stroke-width="2"/><text x="118" y="205" text-anchor="middle" class="big" style="font-size:27px">50.8</text><text x="118" y="232" text-anchor="middle" class="note">Ⅰ系列</text><text x="218" y="205" text-anchor="middle" class="big" style="font-size:27px">54</text><text x="218" y="232" text-anchor="middle" class="note">Ⅱ系列</text><text x="150" y="340" text-anchor="middle" class="b">GB/T 19228.1-2024 明确：</text><text x="150" y="366" text-anchor="middle" class="b">DN50 → Ⅰ系列50.8 / Ⅱ系列54</text><text x="150" y="405" text-anchor="middle" class="note">所以“国标50.8”不是国标唯一选择</text></g>
  <rect x="90" y="610" width="1020" height="70" rx="18" fill="#eaf2fa" stroke="#ccdbea"/><text x="600" y="642" text-anchor="middle" class="h">关键：不要拿“50”直接对“50”</text><text x="600" y="668" text-anchor="middle" class="b">先确认标准、系列和实际外径，再谈管件、密封圈、模具和压接工具能不能共用。</text>
</svg>