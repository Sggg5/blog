<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#fff"/><text x="60" y="72" font-size="34" font-family="Arial,sans-serif" fill="#194994" font-weight="700">不锈钢管开裂后的现场排查顺序</text><g font-family="Arial,sans-serif"><g fill="#eef3f8" stroke="#194994" stroke-width="3"><rect x="70" y="150" width="190" height="110" rx="14"/><rect x="300" y="150" width="190" height="110" rx="14"/><rect x="530" y="150" width="190" height="110" rx="14"/><rect x="760" y="150" width="190" height="110" rx="14"/><rect x="990" y="150" width="150" height="110" rx="14"/></g><g fill="#24384d" font-size="24" text-anchor="middle"><text x="165" y="195">1 位置</text><text x="165" y="230">焊缝/弯头/保温下</text><text x="395" y="195">2 环境</text><text x="395" y="230">氯盐/浓缩/温度</text><text x="625" y="195">3 应力</text><text x="625" y="230">成形/焊接/装配</text><text x="855" y="195">4 裂纹形貌</text><text x="855" y="230">分支/穿晶/晶间</text><text x="1065" y="195">5 验证</text><text x="1065" y="230">材料+金相</text></g><g stroke="#7a8c9e" stroke-width="4" fill="none"><path d="M260 205h40"/><path d="M490 205h40"/><path d="M720 205h40"/><path d="M950 205h40"/></g><rect x="180" y="360" width="840" height="190" rx="18" fill="#f6f8fa" stroke="#8aa0b5" stroke-width="3"/><text x="220" y="410" font-size="27" fill="#194994" font-weight="700">不要看到裂纹就直接写“SCC”</text><text x="220" y="458" font-size="24" fill="#34495e">• 先确认是否同时存在敏感材料、腐蚀环境和拉应力</text><text x="220" y="500" font-size="24" fill="#34495e">• 点蚀、缝隙腐蚀、疲劳和制造缺陷都可能成为裂纹起点或混淆项</text><text x="220" y="542" font-size="24" fill="#34495e">• 试验方法用于比较材料/环境组合，不能机械等同于实际服役寿命</text></g></svg>