<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#fff"/><text x="60" y="75" font-size="34" font-family="Arial,sans-serif" fill="#194994" font-weight="700">氯化物应力腐蚀开裂：三个条件必须同时出现</text><circle cx="390" cy="310" r="190" fill="#eaf1fa" stroke="#194994" stroke-width="4"/><circle cx="610" cy="310" r="190" fill="#eef3f6" stroke="#58728e" stroke-width="4"/><circle cx="500" cy="475" r="190" fill="#f5f7f9" stroke="#7a8c9e" stroke-width="4"/><text x="265" y="260" font-size="30" font-family="Arial,sans-serif" fill="#194994">敏感材料</text><text x="675" y="260" font-size="30" font-family="Arial,sans-serif" fill="#40566e">腐蚀环境</text><text x="405" y="585" font-size="30" font-family="Arial,sans-serif" fill="#40566e">拉应力</text><text x="425" y="345" font-size="24" font-family="Arial,sans-serif" fill="#24384d">304 / 316等</text><text x="655" y="345" font-size="24" font-family="Arial,sans-serif" fill="#24384d">氯离子 + 温度</text><text x="405" y="455" font-size="24" font-family="Arial,sans-serif" fill="#24384d">外载荷 / 残余应力</text><rect x="430" y="300" width="140" height="80" rx="16" fill="#194994"/><text x="452" y="350" font-size="25" font-family="Arial,sans-serif" fill="#fff" font-weight="700">SCC风险</text><text x="60" y="645" font-size="22" font-family="Arial,sans-serif" fill="#617386">工程判断不能只看“有没有氯离子”，还要同时追查温度、应力来源和材料体系。</text></svg>