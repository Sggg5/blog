<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520"><rect width="960" height="520" fill="#fff"/><text x="48" y="58" font-size="28" font-family="sans-serif" fill="#194994" font-weight="700">不锈钢管粗糙度：把“一个 Ra”变成可复现的检验</text><g font-family="sans-serif" font-size="20" fill="#334155"><rect x="55" y="120" width="170" height="90" rx="12" fill="#edf3f8" stroke="#6b87a6"/><text x="82" y="158">① 明确区域</text><text x="75" y="188">内壁/外壁/焊缝</text><rect x="270" y="120" width="170" height="90" rx="12" fill="#edf3f8" stroke="#6b87a6"/><text x="294" y="158">② 规定方向</text><text x="288" y="188">横纹/纵纹/轴向</text><rect x="485" y="120" width="170" height="90" rx="12" fill="#edf3f8" stroke="#6b87a6"/><text x="510" y="158">③ 规定条件</text><text x="500" y="188">滤波与评价长度</text><rect x="700" y="120" width="170" height="90" rx="12" fill="#edf3f8" stroke="#6b87a6"/><text x="726" y="158">④ 多点测量</text><text x="716" y="188">避开偶然单点</text></g><g stroke="#194994" stroke-width="3"><path d="M225 165h45"/><path d="M440 165h45"/><path d="M655 165h45"/></g><rect x="150" y="285" width="660" height="145" rx="16" fill="#f8fafc" stroke="#94a3b8"/><text x="190" y="330" font-size="22" font-family="sans-serif" fill="#194994" font-weight="700">报告至少保留</text><text x="190" y="370" font-size="20" font-family="sans-serif" fill="#475569">测量位置 · 测量方向 · 参数（Ra/Rz…）· 仪器/探针 · 测量条件 · 各测点结果</text><text x="190" y="405" font-size="20" font-family="sans-serif" fill="#475569">对抛光管尤其要记录焊缝区与母材区，避免“平均合格”掩盖局部深纹。</text></svg>