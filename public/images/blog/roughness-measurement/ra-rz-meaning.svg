<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520"><rect width="960" height="520" fill="#fff"/><text x="48" y="58" font-size="28" font-family="sans-serif" fill="#194994" font-weight="700">Ra 相同，不代表表面形貌相同</text><line x1="55" y1="190" x2="905" y2="190" stroke="#94a3b8" stroke-dasharray="7 7"/><path d="M55 185 Q90 145 125 185 T195 185 T265 185 T335 185 T405 185" fill="none" stroke="#315f91" stroke-width="4"/><path d="M535 185 L570 178 L600 80 L630 182 L670 188 L710 185 L745 290 L780 185 L825 182 L905 185" fill="none" stroke="#315f91" stroke-width="4"/><text x="80" y="340" font-size="22" font-family="sans-serif" fill="#334155">表面 A：起伏均匀、峰谷较浅</text><text x="555" y="340" font-size="22" font-family="sans-serif" fill="#334155">表面 B：少量尖峰与深谷</text><text x="48" y="410" font-size="20" font-family="sans-serif" fill="#475569">Ra 描述轮廓偏差的平均水平；局部深划伤、尖峰或方向性纹路可能被平均值“稀释”。</text><text x="48" y="450" font-size="20" font-family="sans-serif" fill="#475569">工程验收应同时规定测量方向、评价长度/滤波条件，并结合 Rz、轮廓图或外观要求。</text></svg>