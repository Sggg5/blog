<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320"><rect width="1000" height="320" fill="#edf5f8"/><text x="35" y="52" font-size="29" fill="#234b60">不锈钢管材装配前清洁控制</text><rect x="25" y="108" width="180" height="95" rx="10" fill="#26667b"/><text x="115" y="162" text-anchor="middle" font-size="23" fill="white">来料检查</text><rect x="220" y="108" width="180" height="95" rx="10" fill="#26667b"/><text x="310" y="162" text-anchor="middle" font-size="23" fill="white">切割去毛刺</text><rect x="415" y="108" width="180" height="95" rx="10" fill="#26667b"/><text x="505" y="162" text-anchor="middle" font-size="23" fill="white">清洁干燥</text><rect x="610" y="108" width="180" height="95" rx="10" fill="#26667b"/><text x="700" y="162" text-anchor="middle" font-size="23" fill="white">封口防护</text><rect x="805" y="108" width="180" height="95" rx="10" fill="#26667b"/><text x="895" y="162" text-anchor="middle" font-size="23" fill="white">装配放行</text><text x="35" y="267" font-size="21" fill="#34596b">防止颗粒、油污、水分和外来铁污染；不合格隔离复检</text></svg>