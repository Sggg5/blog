<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360"><rect width="1000" height="360" fill="#f5f8fb"/><text x="35" y="50" font-size="30" fill="#19384b">不锈钢管内腔残液的风险路径</text><g font-size="24" text-anchor="middle" fill="#163c53"><rect x="35" y="115" width="260" height="110" rx="12" fill="#dcebf4"/><text x="165" y="165">酸洗钝化后</text><text x="165" y="198">残液滞留</text><rect x="365" y="115" width="260" height="110" rx="12" fill="#f9ebd0"/><text x="495" y="165">冲洗与排液</text><text x="495" y="198">不充分</text><rect x="695" y="115" width="260" height="110" rx="12" fill="#f5dcd9"/><text x="825" y="165">干燥后水迹</text><text x="825" y="198">与局部腐蚀</text></g><path d="M295 170H360M625 170H690" stroke="#386b87" stroke-width="5"/><text x="35" y="310" font-size="20" fill="#456477">关注末道水质、管腔排液、干燥验证和封口时效</text></svg>