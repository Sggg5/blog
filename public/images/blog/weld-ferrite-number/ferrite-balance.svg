<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500"><rect width="960" height="500" fill="#fff"/><text x="480" y="48" text-anchor="middle" font-size="28" font-family="Arial,'Microsoft YaHei'" fill="#194994">奥氏体不锈钢焊缝：铁素体不是越少越好，也不是越多越好</text><rect x="70" y="105" width="240" height="270" rx="18" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="190" y="145" text-anchor="middle" font-size="23" font-family="Arial,'Microsoft YaHei'" fill="#194994">铁素体偏低</text><text x="190" y="200" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">凝固组织更接近全奥氏体</text><text x="190" y="240" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">热裂纹敏感性可能上升</text><text x="190" y="300" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">重点复核：焊材、稀释率</text><text x="190" y="330" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">热输入与成分匹配</text><rect x="360" y="105" width="240" height="270" rx="18" fill="#e8f0f8" stroke="#194994" stroke-width="3"/><text x="480" y="145" text-anchor="middle" font-size="23" font-family="Arial,'Microsoft YaHei'" fill="#194994">合适的工艺窗口</text><text x="480" y="200" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">兼顾凝固抗裂能力</text><text x="480" y="240" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">与服役性能要求</text><text x="480" y="300" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">FN目标应来自</text><text x="480" y="330" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">产品规范 / WPS / 服役条件</text><rect x="650" y="105" width="240" height="270" rx="18" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="770" y="145" text-anchor="middle" font-size="23" font-family="Arial,'Microsoft YaHei'" fill="#194994">铁素体偏高</text><text x="770" y="200" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">高温长期服役需谨慎</text><text x="770" y="240" text-anchor="middle" font-size="18" font-family="Arial,'Microsoft YaHei'">可能促进脆性相相关风险</text><text x="770" y="300" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">不能把“抗热裂”</text><text x="770" y="330" text-anchor="middle" font-size="17" font-family="Arial,'Microsoft YaHei'" fill="#536579">简单理解成FN越高越好</text><path d="M310 240h50M600 240h50" stroke="#194994" stroke-width="4"/><path d="M350 232l10 8-10 8M640 232l10 8-10 8" fill="none" stroke="#194994" stroke-width="4"/><text x="480" y="435" text-anchor="middle" font-size="19" font-family="Arial,'Microsoft YaHei'" fill="#536579">FN 是磁响应标定得到的工程量，不应直接当作显微组织体积分数百分比。</text></svg>