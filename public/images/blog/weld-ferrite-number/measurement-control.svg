<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500"><rect width="960" height="500" fill="#fff"/><text x="480" y="48" text-anchor="middle" font-size="28" font-family="Arial,'Microsoft YaHei'" fill="#194994">焊缝铁素体数（FN）测量：先把测量条件固定下来</text><g font-family="Arial,'Microsoft YaHei'"><rect x="55" y="120" width="160" height="110" rx="14" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="135" y="158" text-anchor="middle" font-size="20" fill="#194994">① 仪器与校准</text><text x="135" y="193" text-anchor="middle" font-size="16">确认量程、标准片</text><rect x="245" y="120" width="160" height="110" rx="14" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="325" y="158" text-anchor="middle" font-size="20" fill="#194994">② 测量表面</text><text x="325" y="193" text-anchor="middle" font-size="16">清洁、平整、可重复</text><rect x="435" y="120" width="160" height="110" rx="14" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="515" y="158" text-anchor="middle" font-size="20" fill="#194994">③ 测点位置</text><text x="515" y="193" text-anchor="middle" font-size="16">焊缝中心/分区定义</text><rect x="625" y="120" width="160" height="110" rx="14" fill="#eef4fa" stroke="#194994" stroke-width="2"/><text x="705" y="158" text-anchor="middle" font-size="20" fill="#194994">④ 多点测量</text><text x="705" y="193" text-anchor="middle" font-size="16">记录离散性与异常点</text><path d="M215 175h30M405 175h30M595 175h30" stroke="#194994" stroke-width="4"/><path d="M235 167l10 8-10 8M425 167l10 8-10 8M615 167l10 8-10 8" fill="none" stroke="#194994" stroke-width="3"/><rect x="180" y="295" width="600" height="125" rx="16" fill="#f6f8fb" stroke="#7d8fa5"/><text x="480" y="332" text-anchor="middle" font-size="21" fill="#194994">报告至少说明</text><text x="480" y="370" text-anchor="middle" font-size="18" fill="#263746">材料/焊接方法　·　测量位置　·　仪器/校准　·　单点数据与统计值</text><text x="480" y="400" text-anchor="middle" font-size="17" fill="#536579">薄壁、小曲率、窄焊缝等几何条件会影响可重复性，应在程序中固定。</text></g></svg>