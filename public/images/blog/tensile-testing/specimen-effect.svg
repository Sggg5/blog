<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="#fff"/><text x="50" y="58" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" fill="#134994" font-weight="700">为什么同一材料的伸长率会测出不同结果？</text><line x1="50" y1="85" x2="950" y2="85" stroke="#134994" stroke-width="3"/><g font-family="Arial,'Noto Sans SC',sans-serif" fill="#26384a"><text x="90" y="135" font-size="22" font-weight="700">试样与标距</text><text x="390" y="135" font-size="22" font-weight="700">拉伸过程</text><text x="700" y="135" font-size="22" font-weight="700">最终报告</text><rect x="65" y="170" width="235" height="230" rx="12" fill="#f2f6fa" stroke="#9db3c8"/><path d="M95 270h45l20-35h45l20 35h45v30h-45l-20 35h-45l-20-35H95z" fill="#c9d4df" stroke="#496a88" stroke-width="3"/><line x1="155" y1="350" x2="210" y2="350" stroke="#134994" stroke-width="4"/><text x="135" y="382" font-size="18">原始标距 L₀</text><rect x="365" y="170" width="235" height="230" rx="12" fill="#f2f6fa" stroke="#9db3c8"/><path d="M395 270h40l25-35h45l25 35h40v30h-40l-25 35h-45l-25-35h-40z" fill="#c9d4df" stroke="#496a88" stroke-width="3"/><path d="M475 245l20 55 20-55" fill="none" stroke="#b44" stroke-width="4"/><text x="400" y="370" font-size="18">速率、夹持、断裂位置</text><rect x="665" y="170" width="270" height="230" rx="12" fill="#f2f6fa" stroke="#9db3c8"/><text x="700" y="235" font-size="22">Rm 抗拉强度</text><text x="700" y="285" font-size="22">Rp0.2 规定塑性延伸强度</text><text x="700" y="335" font-size="22">A 断后伸长率</text><text x="700" y="380" font-size="18" fill="#7b3f00">A 必须与标距/试样制度一起看</text><path d="M310 285h45M610 285h45" stroke="#134994" stroke-width="4"/><path d="M345 275l15 10-15 10M645 275l15 10-15 10" fill="#134994"/></g><text x="50" y="475" font-family="Arial,'Noto Sans SC',sans-serif" font-size="19" fill="#52677a">关键：材料没变，不代表试样几何、标距、取样方向和试验控制方式可以改变而仍直接横向比较。</text></svg>