<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#fff"/><text x="50" y="58" font-family="Arial,'Noto Sans SC',sans-serif" font-size="30" fill="#134994" font-weight="700">拉伸结果异常时，不要先怀疑材料</text><line x1="50" y1="85" x2="950" y2="85" stroke="#134994" stroke-width="3"/><g font-family="Arial,'Noto Sans SC',sans-serif"><rect x="60" y="130" width="180" height="80" rx="12" fill="#eaf1f8" stroke="#7594b2"/><text x="91" y="178" font-size="21" fill="#26384a">结果异常</text><path d="M240 170h70" stroke="#134994" stroke-width="4"/><path d="M300 160l15 10-15 10" fill="#134994"/><rect x="315" y="120" width="220" height="100" rx="12" fill="#f5f8fb" stroke="#9db3c8"/><text x="345" y="158" font-size="19">① 试样与取样</text><text x="345" y="190" font-size="17" fill="#52677a">方向、宽度、标距、焊缝位置</text><path d="M535 170h70" stroke="#134994" stroke-width="4"/><path d="M595 160l15 10-15 10" fill="#134994"/><rect x="610" y="120" width="300" height="100" rx="12" fill="#f5f8fb" stroke="#9db3c8"/><text x="640" y="158" font-size="19">② 试验机与引伸计</text><text x="640" y="190" font-size="17" fill="#52677a">校准、对中、夹持、量程</text><path d="M760 220v55" stroke="#134994" stroke-width="4"/><path d="M750 265l10 15 10-15" fill="#134994"/><rect x="610" y="280" width="300" height="100" rx="12" fill="#f5f8fb" stroke="#9db3c8"/><text x="640" y="318" font-size="19">③ 速率与控制方法</text><text x="640" y="350" font-size="17" fill="#52677a">应变速率/横梁速率是否合规</text><path d="M610 330h-70" stroke="#134994" stroke-width="4"/><path d="M550 320l-15 10 15 10" fill="#134994"/><rect x="315" y="280" width="220" height="100" rx="12" fill="#f5f8fb" stroke="#9db3c8"/><text x="345" y="318" font-size="19">④ 断裂与测量</text><text x="345" y="350" font-size="17" fill="#52677a">断口位置、拼接、最终标距</text><path d="M425 380v55" stroke="#134994" stroke-width="4"/><path d="M415 425l10 15 10-15" fill="#134994"/><rect x="250" y="440" width="350" height="75" rx="12" fill="#eaf1f8" stroke="#7594b2"/><text x="290" y="485" font-size="20" fill="#26384a">⑤ 最后再判断材料/工艺波动</text></g></svg>