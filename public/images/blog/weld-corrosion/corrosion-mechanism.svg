<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#eef4fa"/></linearGradient>
  <linearGradient id="oxide" x1="0" x2="1"><stop offset="0%" stop-color="#355d94"/><stop offset="55%" stop-color="#7d7c83"/><stop offset="100%" stop-color="#b97232"/></linearGradient>
  <pattern id="steel" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#dfe5eb"/><line x1="0" y1="0" x2="0" y2="12" stroke="#c6ced8" stroke-width="2"/></pattern>
  <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#1772c8"/></marker>
  <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#d94b3d"/></marker>
  <style>.title{font:700 34px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.sub{font:400 18px Arial,'Microsoft YaHei',sans-serif;fill:#5c6f84}.h{font:700 18px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.b{font:400 16px Arial,'Microsoft YaHei',sans-serif;fill:#40566f}.z{font:700 22px Arial,'Microsoft YaHei',sans-serif;fill:#222}.zs{font:700 17px Arial,'Microsoft YaHei',sans-serif;fill:#222}</style>
</defs>
<rect width="1200" height="720" fill="url(#bg)" rx="24"/>
<text x="600" y="58" text-anchor="middle" class="title">为什么不锈钢的焊缝更容易腐蚀？</text>
<text x="600" y="90" text-anchor="middle" class="sub">焊接会改变焊缝及其附近区域的表面状态，使钝化膜变弱，在含氯环境中更容易先发生点蚀 / 锈斑。</text>
<rect x="60" y="120" width="300" height="105" rx="16" fill="#eaf3fb" stroke="#c7dbee"/><circle cx="90" cy="150" r="22" fill="#1772c8"/><text x="90" y="158" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="125" y="154" class="h">焊接热循环使表面氧化</text><text x="125" y="184" class="b">形成热着色 / 氧化层，</text><text x="125" y="208" class="b">改变原有表面状态。</text>
<rect x="450" y="120" width="300" height="105" rx="16" fill="#eaf3fb" stroke="#c7dbee"/><circle cx="480" cy="150" r="22" fill="#1772c8"/><text x="480" y="158" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="515" y="154" class="h">近表面形成贫铬层</text><text x="515" y="184" class="b">铬被消耗或重新分布，</text><text x="515" y="208" class="b">钝化能力下降。</text>
<rect x="840" y="120" width="300" height="105" rx="16" fill="#fdeeee" stroke="#f2c8c3"/><circle cx="870" cy="150" r="22" fill="#d94b3d"/><text x="870" y="158" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="905" y="154" class="h" fill="#b7392d">含氯环境更易腐蚀</text><text x="905" y="184" class="b">点蚀 / 锈斑更容易先出现在</text><text x="905" y="208" class="b">焊缝及其附近区域。</text>
<rect x="40" y="360" width="1120" height="180" fill="url(#steel)" stroke="#8ea0b3" stroke-width="2"/>
<path d="M300 360 C430 360 500 360 530 360 C560 390 575 475 600 520 C625 475 640 390 670 360 C700 360 770 360 900 360" fill="#dde4ea" stroke="#7a8797" stroke-width="4"/>
<path d="M290 348 C430 340 520 338 600 338 C680 338 770 340 910 348" fill="none" stroke="url(#oxide)" stroke-width="14" stroke-linecap="round"/>
<path d="M315 356 C440 351 520 350 600 350 C680 350 760 351 885 356" fill="none" stroke="#dcc89e" stroke-width="7" stroke-linecap="round"/>
<line x1="300" y1="360" x2="300" y2="540" stroke="#7d8ea1" stroke-dasharray="8 8"/><line x1="900" y1="360" x2="900" y2="540" stroke="#7d8ea1" stroke-dasharray="8 8"/>
<text x="150" y="460" text-anchor="middle" class="z">母材</text><text x="150" y="490" text-anchor="middle" class="zs">（不锈钢）</text><text x="390" y="470" text-anchor="middle" class="z">热影响区</text><text x="390" y="500" text-anchor="middle" class="zs">（HAZ）</text><text x="600" y="460" text-anchor="middle" class="z">焊缝</text><text x="600" y="490" text-anchor="middle" class="zs">（填充金属）</text><text x="810" y="470" text-anchor="middle" class="z">热影响区</text><text x="810" y="500" text-anchor="middle" class="zs">（HAZ）</text><text x="1050" y="460" text-anchor="middle" class="z">母材</text><text x="1050" y="490" text-anchor="middle" class="zs">（不锈钢）</text>
<text x="520" y="290" class="zs">焊接热着色 / 氧化层</text><line x1="610" y1="298" x2="580" y2="337" stroke="#333" stroke-width="2.5" marker-end="url(#aB)"/><text x="690" y="330" class="zs">贫铬层</text><line x1="720" y1="335" x2="650" y2="351" stroke="#333" stroke-width="2.5" marker-end="url(#aB)"/>
<circle cx="900" cy="305" r="19" fill="#3f8bd9"/><circle cx="950" cy="282" r="19" fill="#3f8bd9"/><circle cx="1000" cy="305" r="19" fill="#3f8bd9"/><text x="900" y="312" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Cl⁻</text><text x="950" y="289" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Cl⁻</text><text x="1000" y="312" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Cl⁻</text>
<path d="M1000 365 l10 -8 12 10 8 -12 10 10 -2 14 -20 10 -20 -4z" fill="#be6a33"/><text x="1025" y="334" class="h" fill="#c23f30">点蚀 / 锈斑</text><line x1="950" y1="225" x2="995" y2="358" stroke="#d94b3d" stroke-width="3" marker-end="url(#aR)"/>
<rect x="60" y="575" width="1080" height="92" rx="18" fill="#f2f7fc" stroke="#d1dfed"/><text x="600" y="625" text-anchor="middle" font-size="26" font-weight="700" fill="#0f458f">焊缝及热影响区的耐蚀性通常低于母材，更容易发生局部腐蚀。</text><text x="600" y="655" text-anchor="middle" class="sub">焊后清洗、酸洗钝化、控制热输入和良好气体保护，有助于恢复耐蚀性。</text>
</svg>