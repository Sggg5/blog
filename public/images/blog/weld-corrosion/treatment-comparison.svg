<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fafcff"/><stop offset="100%" stop-color="#eef4fa"/></linearGradient><style>.title{font:700 38px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.sub{font:400 18px Arial,'Microsoft YaHei',sans-serif;fill:#5a6c80}.head{font:700 28px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.h{font:700 18px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.b{font:400 16px Arial,'Microsoft YaHei',sans-serif;fill:#40566f}.sum{font:700 22px Arial,'Microsoft YaHei',sans-serif}</style></defs><rect width="1400" height="820" rx="24" fill="url(#bg)"/><text x="700" y="58" text-anchor="middle" class="title">不锈钢焊后表面处理方式对比</text><text x="700" y="90" text-anchor="middle" class="sub">表面变亮不等于耐蚀性完全恢复，关键在于是否真正去除了受影响表层并恢复稳定钝化状态。</text>
<g transform="translate(30 120)"><rect width="420" height="620" rx="20" fill="#f7f9fc" stroke="#d3dfeb" stroke-width="2"/><rect width="420" height="80" rx="20" fill="#6b88a8"/><text x="42" y="50" class="head">1 未处理</text><rect x="30" y="120" width="360" height="180" rx="12" fill="#fff" stroke="#d4dee8"/><rect x="30" y="210" width="360" height="90" fill="#dfe5eb"/><path d="M90 208 C160 198 260 198 330 208" fill="none" stroke="#986d55" stroke-width="18"/><path d="M140 300 C170 230 190 215 210 205 C230 215 250 230 280 300" fill="#d7dee6" stroke="#7e8995" stroke-width="3"/><path d="M110 218 C165 213 255 213 310 218" fill="none" stroke="#dcc89e" stroke-width="8"/><text x="72" y="145" class="h">焊接氧化层</text><text x="250" y="145" class="h">贫铬化层</text><text x="210" y="270" text-anchor="middle" class="h">焊缝</text><rect x="30" y="330" width="360" height="180" rx="14" fill="#eef4f9"/><text x="54" y="370" class="b">• 热着色、氧化层保留</text><text x="54" y="406" class="b">• 近表面贫铬层仍存在</text><text x="54" y="442" class="b">• 表面粗糙，污染物更易滞留</text><text x="54" y="478" class="b">• 点蚀 / 缝隙腐蚀风险最高</text><rect x="30" y="535" width="360" height="62" rx="16" fill="#fdeceb"/><text x="210" y="575" text-anchor="middle" class="sum" fill="#c43d32">耐蚀性较差</text></g>
<g transform="translate(490 120)"><rect width="420" height="620" rx="20" fill="#f7f9fc" stroke="#d3dfeb" stroke-width="2"/><rect width="420" height="80" rx="20" fill="#6b88a8"/><text x="42" y="50" class="head">2 机械抛光</text><rect x="30" y="120" width="360" height="180" rx="12" fill="#fff" stroke="#d4dee8"/><rect x="30" y="210" width="360" height="90" fill="#dfe5eb"/><path d="M90 208 C160 205 260 205 330 208" fill="none" stroke="#9aa5b2" stroke-width="12"/><path d="M140 300 C170 230 190 215 210 205 C230 215 250 230 280 300" fill="#d7dee6" stroke="#7e8995" stroke-width="3"/><path d="M135 216 C170 213 250 213 285 216" fill="none" stroke="#dcc89e" stroke-width="7"/><text x="78" y="145" class="h">外观更亮</text><text x="245" y="145" class="h">可能残留贫铬层</text><text x="210" y="270" text-anchor="middle" class="h">焊缝</text><rect x="30" y="330" width="360" height="180" rx="14" fill="#eef4f9"/><text x="54" y="370" class="b">• 去掉部分热色和表面污染</text><text x="54" y="406" class="b">• 表面更平整、更美观</text><text x="54" y="442" class="b">• 去除深度不稳定，可能残留受影响层</text><text x="54" y="478" class="h" fill="#c67d12">• 表面变亮 ≠ 耐蚀性完全恢复</text><rect x="30" y="535" width="360" height="62" rx="16" fill="#fff3dd"/><text x="210" y="575" text-anchor="middle" class="sum" fill="#c67d12">耐蚀性有所改善</text></g>
<g transform="translate(950 120)"><rect width="420" height="620" rx="20" fill="#f7f9fc" stroke="#d3dfeb" stroke-width="2"/><rect width="420" height="80" rx="20" fill="#6b88a8"/><text x="42" y="50" class="head">3 酸洗钝化</text><rect x="30" y="120" width="360" height="180" rx="12" fill="#fff" stroke="#d4dee8"/><rect x="30" y="210" width="360" height="90" fill="#dfe5eb"/><path d="M90 208 C160 208 260 208 330 208" fill="none" stroke="#49a3ff" stroke-width="10"/><path d="M140 300 C170 230 190 215 210 205 C230 215 250 230 280 300" fill="#d7dee6" stroke="#7e8995" stroke-width="3"/><text x="76" y="145" class="h">去除氧化与受影响层</text><text x="260" y="145" class="h">恢复钝化膜</text><text x="210" y="270" text-anchor="middle" class="h">焊缝</text><rect x="30" y="330" width="360" height="180" rx="14" fill="#eef4f9"/><text x="54" y="370" class="b">• 去除焊接氧化层和贫铬表层</text><text x="54" y="406" class="b">• 表面恢复洁净金属本色</text><text x="54" y="442" class="b">• 随后形成稳定、致密的钝化膜</text><text x="54" y="478" class="b">• 对腐蚀敏感环境更有利</text><rect x="30" y="535" width="360" height="62" rx="16" fill="#ebf8ed"/><text x="210" y="575" text-anchor="middle" class="sum" fill="#28954f">耐蚀性最佳</text></g><rect x="50" y="760" width="1300" height="42" rx="18" fill="#edf4fb"/><text x="700" y="788" text-anchor="middle" class="b" style="font-size:18px">结论：机械抛光主要改善外观；酸洗钝化更关注受影响表层的去除和耐蚀状态的恢复。</text></svg>