<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#fafcff"/><stop offset="100%" stop-color="#eef4fa"/></linearGradient><marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L8 3z" fill="#1772c8"/></marker><style>.title{font:700 40px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.sub{font:400 18px Arial,'Microsoft YaHei',sans-serif;fill:#5a6c80}.h{font:700 17px Arial,'Microsoft YaHei',sans-serif;fill:#0f458f}.b{font:400 14px Arial,'Microsoft YaHei',sans-serif;fill:#40566f}.white{font:700 20px Arial,'Microsoft YaHei',sans-serif;fill:#fff}</style></defs><rect width="1400" height="900" rx="24" fill="url(#bg)"/><text x="700" y="58" text-anchor="middle" class="title">焊缝生锈排查流程</text><text x="700" y="90" text-anchor="middle" class="sub">先看腐蚀位置，再依次检查热着色、焊根保护、铁污染、焊后处理和使用环境。</text><rect x="40" y="125" width="300" height="66" rx="33" fill="#0f69c2"/><text x="190" y="166" text-anchor="middle" class="white">发现焊缝锈斑 / 点蚀</text>
<g transform="translate(40 235)"><rect width="205" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">1</text><text x="56" y="34" class="h">是否集中在焊缝</text><text x="56" y="58" class="h">及两侧？</text><text x="18" y="96" class="b">若远离焊缝的母材也随机</text><text x="18" y="118" class="b">出现锈点，应同时检查外部</text><text x="18" y="140" class="b">污染和储运环境。</text><line x1="205" y1="72" x2="240" y2="72" stroke="#1772c8" stroke-width="3" marker-end="url(#ab)"/></g>
<g transform="translate(275 235)"><rect width="205" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">2</text><text x="56" y="34" class="h">是否有明显热着色</text><text x="56" y="58" class="h">或氧化色？</text><text x="18" y="96" class="b">黄色、蓝色、褐色甚至灰黑</text><text x="18" y="118" class="b">通常提示焊接氧化程度较高。</text><line x1="205" y1="72" x2="240" y2="72" stroke="#1772c8" stroke-width="3" marker-end="url(#ab)"/></g>
<g transform="translate(510 235)"><rect width="205" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">3</text><text x="56" y="34" class="h">焊根保护是否不足？</text><text x="18" y="84" class="b">检查背面是否发黑、严重氧化，</text><text x="18" y="106" class="b">是否存在空气置换不足或保护</text><text x="18" y="128" class="b">气体过早停止。</text><line x1="205" y1="72" x2="240" y2="72" stroke="#1772c8" stroke-width="3" marker-end="url(#ab)"/></g>
<g transform="translate(745 235)"><rect width="205" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">4</text><text x="56" y="34" class="h">是否存在铁污染？</text><text x="18" y="84" class="b">检查碳钢刷、普通砂轮、工装</text><text x="18" y="106" class="b">平台、铁屑和碳钢粉尘等交叉</text><text x="18" y="128" class="b">污染来源。</text><line x1="205" y1="72" x2="240" y2="72" stroke="#1772c8" stroke-width="3" marker-end="url(#ab)"/></g>
<g transform="translate(980 235)"><rect width="205" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">5</text><text x="56" y="34" class="h">焊后是否仅抛光？</text><text x="18" y="84" class="b">如果只是刷磨或抛亮，没有有效</text><text x="18" y="106" class="b">去除受影响表层，应重点检查酸</text><text x="18" y="128" class="b">洗钝化工艺。</text><line x1="205" y1="72" x2="240" y2="72" stroke="#1772c8" stroke-width="3" marker-end="url(#ab)"/></g>
<g transform="translate(1215 235)"><rect width="155" height="145" rx="16" fill="#eef5fb" stroke="#c8daea"/><circle cx="28" cy="28" r="20" fill="#176fc4"/><text x="28" y="35" text-anchor="middle" fill="#fff" font-weight="700">6</text><text x="56" y="34" class="h">环境是否含氯</text><text x="56" y="58" class="h">或长期滞水？</text><text x="18" y="96" class="b">含氯、潮湿、沉积</text><text x="18" y="118" class="b">和缝隙环境会放大</text><text x="18" y="140" class="b">局部腐蚀风险。</text></g>
<rect x="40" y="450" width="1320" height="330" rx="22" fill="#eef5fb" stroke="#d1dfec"/><rect x="55" y="468" width="220" height="64" rx="32" fill="#0f69c2"/><text x="165" y="508" text-anchor="middle" class="white">改善措施</text><text x="300" y="508" class="sub">根据排查结果逐项改善，不要只做外观返修。</text>
<g transform="translate(65 560)"><rect width="235" height="170" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="18" y="32" class="h">1 保护气体与热输入</text><text x="18" y="66" class="b">• 保证保护气体稳定覆盖</text><text x="18" y="92" class="b">• 控制热输入和高温停留</text><text x="18" y="118" class="b">• 避免保护气体过早停止</text></g><g transform="translate(320 560)"><rect width="235" height="170" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="18" y="32" class="h">2 加强焊根保护</text><text x="18" y="66" class="b">• 有焊根结构做好背面充氩</text><text x="18" y="92" class="b">• 确保空气充分置换</text><text x="18" y="118" class="b">• 避免根部发黑和糖化氧化</text></g><g transform="translate(575 560)"><rect width="235" height="170" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="18" y="32" class="h">3 避免铁污染</text><text x="18" y="66" class="b">• 工具与碳钢分开管理</text><text x="18" y="92" class="b">• 不锈钢专用钢丝刷和砂轮</text><text x="18" y="118" class="b">• 防止铁屑、粉尘二次污染</text></g><g transform="translate(830 560)"><rect width="235" height="170" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="18" y="32" class="h">4 完整焊后处理</text><text x="18" y="66" class="b">• 去除热着色和氧化层</text><text x="18" y="92" class="b">• 酸洗去除受影响表层</text><text x="18" y="118" class="b">• 钝化恢复稳定表面状态</text></g><g transform="translate(1085 560)"><rect width="235" height="170" rx="16" fill="#fff" stroke="#d3dfeb"/><text x="18" y="32" class="h">5 结合服役环境</text><text x="18" y="66" class="b">• 评估氯离子和滞水风险</text><text x="18" y="92" class="b">• 优化排水和缝隙结构</text><text x="18" y="118" class="b">• 必要时增加维护和清洗频次</text></g><rect x="60" y="810" width="1280" height="54" rx="18" fill="#f2f7fc"/><text x="700" y="844" text-anchor="middle" font-size="23" font-weight="700" fill="#0f458f">系统排查位置、焊接、污染、表面处理和环境，才能真正找到焊缝生锈的根本原因。</text></svg>