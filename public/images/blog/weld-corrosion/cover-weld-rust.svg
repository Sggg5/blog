<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">不锈钢焊缝锈蚀特写</title>
  <desc id="desc">不锈钢管件焊接接头附近出现热着色和局部锈斑的近景特写</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8ef"/>
      <stop offset="0.55" stop-color="#9fb2c2"/>
      <stop offset="1" stop-color="#6e8293"/>
    </linearGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8a93"/>
      <stop offset="0.18" stop-color="#d7dde1"/>
      <stop offset="0.42" stop-color="#f7f8f8"/>
      <stop offset="0.62" stop-color="#aab4bc"/>
      <stop offset="0.84" stop-color="#edf0f2"/>
      <stop offset="1" stop-color="#818c95"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c979f"/>
      <stop offset="0.18" stop-color="#edf1f3"/>
      <stop offset="0.48" stop-color="#b7c0c6"/>
      <stop offset="0.72" stop-color="#f7f8f8"/>
      <stop offset="1" stop-color="#7b878f"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c72a3"/>
      <stop offset="0.25" stop-color="#7f56a2"/>
      <stop offset="0.52" stop-color="#c27b44"/>
      <stop offset="0.75" stop-color="#d3a764"/>
      <stop offset="1" stop-color="#6c7ca0"/>
    </linearGradient>
    <radialGradient id="rust" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#3f1f10"/>
      <stop offset="0.35" stop-color="#7f3717"/>
      <stop offset="0.7" stop-color="#bd682c"/>
      <stop offset="1" stop-color="#d58a48" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <pattern id="brush" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 3 H16 M0 8 H16 M0 13 H16" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.42" filter="url(#blur)">
    <rect x="70" y="40" width="70" height="600" rx="30" fill="#d9e2e8"/>
    <rect x="980" y="20" width="60" height="630" rx="28" fill="#d9e2e8"/>
    <rect x="90" y="110" width="1000" height="46" rx="20" fill="#6b7e8c"/>
    <rect x="40" y="520" width="1100" height="44" rx="20" fill="#8194a4"/>
  </g>

  <g>
    <path d="M360 0 H650 V230 C650 270 670 292 710 300 H1200 V675 H635 C505 675 430 608 430 490 V305 C430 255 405 230 360 230 Z" fill="url(#steelV)"/>
    <path d="M430 297 C500 268 582 263 658 285 C690 294 718 305 746 316" fill="none" stroke="url(#heat)" stroke-width="36" stroke-linecap="round" opacity="0.9"/>
    <path d="M438 308 C500 285 572 281 640 298 C683 309 708 322 744 338" fill="none" stroke="#d7dde1" stroke-width="23" stroke-linecap="round"/>
    <g stroke="#8e99a1" stroke-width="3" opacity="0.9">
      <path d="M454 313 l18 -13"/><path d="M477 306 l18 -13"/><path d="M501 301 l18 -13"/><path d="M526 298 l18 -13"/><path d="M551 298 l18 -13"/><path d="M576 300 l18 -13"/><path d="M602 304 l18 -13"/><path d="M627 310 l18 -13"/><path d="M652 318 l18 -13"/><path d="M677 327 l18 -13"/><path d="M701 337 l18 -13"/>
    </g>
    <path d="M360 0 H650 V230 C650 270 670 292 710 300 H1200 V675 H635 C505 675 430 608 430 490 V305 C430 255 405 230 360 230 Z" fill="url(#brush)"/>
  </g>

  <g opacity="0.95">
    <ellipse cx="774" cy="352" rx="70" ry="58" fill="url(#rust)"/>
    <path d="M750 334 C770 315 802 320 814 339 C826 359 808 383 780 386 C750 389 730 367 738 346 Z" fill="#6f2f17"/>
    <path d="M758 342 C770 333 790 335 798 347 C802 360 790 370 775 368 C759 366 749 356 758 342 Z" fill="#32170e"/>
    <path d="M794 390 C805 420 814 451 809 494" fill="none" stroke="#9a4a21" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
    <path d="M818 382 C832 410 842 438 840 469" fill="none" stroke="#c97835" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <g fill="#9b4a22" opacity="0.7">
      <circle cx="835" cy="330" r="7"/><circle cx="858" cy="347" r="5"/><circle cx="850" cy="374" r="4"/><circle cx="893" cy="357" r="6"/><circle cx="908" cy="391" r="3"/>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="675" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
</svg>
