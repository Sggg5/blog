<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-label="不锈钢管件镍析出调查的实验对照与放行流程">
<rect width="1120" height="500" fill="#f5f8fa"/><text x="560" y="51" font-family="sans-serif" font-size="29" font-weight="bold" fill="#1d3b52" text-anchor="middle">镍析出异常：先定位来源，再谈工艺调整</text>
<g font-family="sans-serif" text-anchor="middle" fill="#203d50">
<rect x="380" y="85" width="360" height="64" rx="12" fill="#d9eaf3" stroke="#5d92b0" stroke-width="2"/><text x="560" y="126" font-size="23">同批样品 / 同一浸泡方案</text>
<path d="M560 149v33M194 182h732M194 182v29M560 182v29M926 182v29" stroke="#66889a" stroke-width="3" fill="none"/>
<rect x="42" y="211" width="303" height="116" rx="14" fill="#e5f4ed" stroke="#62a38c" stroke-width="2"/><text x="193" y="250" font-size="23" font-weight="bold">A 空白水</text><text x="193" y="281" font-size="18">排除容器与水源本底</text><text x="193" y="307" font-size="16">同批试剂 / 同样储存</text>
<rect x="409" y="211" width="303" height="116" rx="14" fill="#fff0dc" stroke="#cda15c" stroke-width="2"/><text x="560" y="250" font-size="23" font-weight="bold">B 标准生产样</text><text x="560" y="281" font-size="18">记录表面与生产批次</text><text x="560" y="307" font-size="16">焊接 / 酸洗 / 漂洗状态</text>
<rect x="775" y="211" width="303" height="116" rx="14" fill="#eee7f8" stroke="#9c7bb6" stroke-width="2"/><text x="926" y="250" font-size="23" font-weight="bold">C 工艺对照样</text><text x="926" y="281" font-size="18">仅改变一个工艺因素</text><text x="926" y="307" font-size="16">例如漂洗强度或储存时间</text>
<path d="M193 327v37M560 327v37M926 327v37M193 364h733M560 364v22" stroke="#66889a" stroke-width="3" fill="none"/>
<rect x="237" y="386" width="646" height="70" rx="13" fill="#dcecf4" stroke="#5d92b0" stroke-width="2"/><text x="560" y="414" font-size="21" font-weight="bold">统一分析 → 空白校正 → 复测确认 → 判定与追溯</text><text x="560" y="442" font-size="17">工艺筛查数据不能替代法定卫生安全评价</text>
</g></svg>
