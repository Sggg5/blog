<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:22px;font-weight:600}.b{font-size:18px}.box{fill:#f4f8fb;stroke:#6f879a;stroke-width:2}.key{fill:#eaf3fa;stroke:#2f6f9f;stroke-width:2}.a{stroke:#647f94;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#647f94"/></marker></defs><text x="55" y="60" class="t h">涡流探伤不是“看见裂纹”，而是识别电磁响应变化</text><rect x="65" y="140" width="230" height="130" rx="14" class="box"/><text x="180" y="185" text-anchor="middle" class="t s">激励线圈</text><text x="180" y="225" text-anchor="middle" class="t b">交变磁场</text><rect x="485" y="140" width="230" height="130" rx="14" class="key"/><text x="600" y="185" text-anchor="middle" class="t s">导电钢管</text><text x="600" y="225" text-anchor="middle" class="t b">表面/近表面形成涡流</text><rect x="905" y="140" width="230" height="130" rx="14" class="box"/><text x="1020" y="185" text-anchor="middle" class="t s">接收与判别</text><text x="1020" y="225" text-anchor="middle" class="t b">幅值、相位等信号变化</text><path d="M295 205H475" class="a"/><path d="M715 205H895" class="a"/><rect x="120" y="390" width="250" height="150" rx="14" class="box"/><text x="245" y="430" text-anchor="middle" class="t s">缺陷会改变什么？</text><text x="245" y="470" text-anchor="middle" class="t b">局部导电路径与电磁耦合</text><text x="245" y="505" text-anchor="middle" class="t b">产生可识别的异常响应</text><rect x="475" y="390" width="250" height="150" rx="14" class="key"/><text x="600" y="430" text-anchor="middle" class="t s">同时也会受干扰</text><text x="600" y="470" text-anchor="middle" class="t b">管径、壁厚、材质、速度</text><text x="600" y="505" text-anchor="middle" class="t b">探头间隙、焊缝位置等</text><rect x="830" y="390" width="250" height="150" rx="14" class="box"/><text x="955" y="430" text-anchor="middle" class="t s">所以必须用参考样管</text><text x="955" y="470" text-anchor="middle" class="t b">人工参考缺口建立灵敏度</text><text x="955" y="505" text-anchor="middle" class="t b">班前/换规格/过程再核查</text><path d="M370 465H465" class="a"/><path d="M725 465H820" class="a"/><text x="600" y="625" text-anchor="middle" class="t b">核心：稳定的设备 + 合适的参考标准 + 受控的线速与探头状态，比单独追求“越慢越好”更重要。</text></svg>