<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fff"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f5f8fb;stroke:#70899d;stroke-width:2}.key{fill:#eaf3fa;stroke:#2f6f9f;stroke-width:2}.a{stroke:#70899d;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#70899d"/></marker></defs><text x="55" y="60" class="t h">在线涡流探伤：一条可追溯的过程控制链</text><g><rect x="55" y="145" width="190" height="120" rx="14" class="box"/><text x="150" y="185" text-anchor="middle" class="t s">① 规格确认</text><text x="150" y="220" text-anchor="middle" class="t b">材质/外径/壁厚</text><rect x="290" y="145" width="190" height="120" rx="14" class="key"/><text x="385" y="185" text-anchor="middle" class="t s">② 参考样管</text><text x="385" y="220" text-anchor="middle" class="t b">参考缺口与灵敏度</text><rect x="525" y="145" width="190" height="120" rx="14" class="box"/><text x="620" y="185" text-anchor="middle" class="t s">③ 设备设定</text><text x="620" y="220" text-anchor="middle" class="t b">频率/增益/相位/阈值</text><rect x="760" y="145" width="190" height="120" rx="14" class="box"/><text x="855" y="185" text-anchor="middle" class="t s">④ 在线检测</text><text x="855" y="220" text-anchor="middle" class="t b">稳定线速与导向</text><rect x="995" y="145" width="150" height="120" rx="14" class="key"/><text x="1070" y="185" text-anchor="middle" class="t s">⑤ 报警</text><text x="1070" y="220" text-anchor="middle" class="t b">标记/隔离</text><path d="M245 205H280" class="a"/><path d="M480 205H515" class="a"/><path d="M715 205H750" class="a"/><path d="M950 205H985" class="a"/></g><rect x="155" y="380" width="250" height="140" rx="14" class="box"/><text x="280" y="420" text-anchor="middle" class="t s">过程核查</text><text x="280" y="458" text-anchor="middle" class="t b">换规格 / 换班 / 异常后</text><text x="280" y="490" text-anchor="middle" class="t b">重新通过参考样管确认</text><rect x="475" y="380" width="250" height="140" rx="14" class="key"/><text x="600" y="420" text-anchor="middle" class="t s">异常管处理</text><text x="600" y="458" text-anchor="middle" class="t b">复验、定位、隔离</text><text x="600" y="490" text-anchor="middle" class="t b">不得只清报警记录</text><rect x="795" y="380" width="250" height="140" rx="14" class="box"/><text x="920" y="420" text-anchor="middle" class="t s">质量记录</text><text x="920" y="458" text-anchor="middle" class="t b">规格、参数、样管、时间</text><text x="920" y="490" text-anchor="middle" class="t b">报警与处置结果可追溯</text><path d="M405 450H465" class="a"/><path d="M725 450H785" class="a"/><text x="600" y="610" text-anchor="middle" class="t b">线速不是孤立参数：只有在设备响应、探头结构、缺陷方向和参考样管验证共同满足时，才谈得上有效检测。</text></svg>