<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:20px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#6b879f;stroke-width:2}.key{fill:#eef5fb;stroke:#2d6ea3;stroke-width:2}.a{stroke:#71899e;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#71899e"/></marker></defs><text x="60" y="62" class="t h">压力掉了，不等于管子漏了：现场排查顺序</text><rect x="440" y="115" width="320" height="90" rx="16" class="key"/><text x="600" y="152" text-anchor="middle" class="t s">发现压力下降 / 保压异常</text><text x="600" y="181" text-anchor="middle" class="t b">先记录压力、时间与温度</text><path d="M600 205 V255" class="a"/><rect x="90" y="270" width="270" height="125" rx="16" class="box"/><text x="225" y="310" text-anchor="middle" class="t s">① 仪表与温度</text><text x="225" y="345" text-anchor="middle" class="t b">压力表量程/校准</text><text x="225" y="373" text-anchor="middle" class="t b">水温、环境温度变化</text><rect x="465" y="270" width="270" height="125" rx="16" class="box"/><text x="600" y="310" text-anchor="middle" class="t s">② 试验工装</text><text x="600" y="345" text-anchor="middle" class="t b">端封、阀门、软管、接头</text><text x="600" y="373" text-anchor="middle" class="t b">排气是否充分</text><rect x="840" y="270" width="270" height="125" rx="16" class="box"/><text x="975" y="310" text-anchor="middle" class="t s">③ 产品本体</text><text x="975" y="345" text-anchor="middle" class="t b">纵焊缝、环焊缝、母材</text><text x="975" y="373" text-anchor="middle" class="t b">成形区与连接部位</text><path d="M600 255 H225 V265" class="a"/><path d="M600 255 V265" class="a"/><path d="M600 255 H975 V265" class="a"/><rect x="180" y="475" width="840" height="130" rx="16" class="key"/><text x="600" y="515" text-anchor="middle" class="t s">定位原则</text><text x="600" y="550" text-anchor="middle" class="t b">看见实际泄漏点，比只看压力表下降更有判别力；工装泄漏必须与产品缺陷分开。</text><text x="600" y="580" text-anchor="middle" class="t b">水压检验结束后记录批次、试验参数、异常位置和处置结果，才能形成可追溯数据。</text></svg>