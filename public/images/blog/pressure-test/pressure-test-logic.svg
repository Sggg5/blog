<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#fff"/><style>.t{font-family:'Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:600}.b{font-size:17px}.box{fill:#f7fafc;stroke:#6b879f;stroke-width:2}.key{fill:#eef5fb;stroke:#2d6ea3;stroke-width:2}.a{stroke:#71899e;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#71899e"/></marker></defs><text x="60" y="62" class="t h">不锈钢管压力检验：先分清“材料管”与“管路系统”</text><rect x="70" y="130" width="470" height="170" rx="18" class="key"/><text x="305" y="175" text-anchor="middle" class="t s">成品不锈钢管 / Tube / Pipe</text><text x="305" y="215" text-anchor="middle" class="t b">目标：发现贯穿性缺陷、焊缝泄漏等</text><text x="305" y="250" text-anchor="middle" class="t b">按产品标准选择水压或无损电检测</text><rect x="660" y="130" width="470" height="170" rx="18" class="box"/><text x="895" y="175" text-anchor="middle" class="t s">安装后的管路系统</text><text x="895" y="215" text-anchor="middle" class="t b">目标：验证系统强度、连接与严密性</text><text x="895" y="250" text-anchor="middle" class="t b">压力、介质、保压按设计/施工规范执行</text><path d="M305 300 V365" class="a"/><path d="M895 300 V365" class="a"/><rect x="80" y="380" width="430" height="190" rx="18" class="box"/><text x="295" y="425" text-anchor="middle" class="t s">典型产品标准思路</text><text x="110" y="465" class="t b">ASTM A269/A269M：每根管要求</text><text x="110" y="500" class="t b">无损电检测或水压试验之一</text><text x="110" y="535" class="t b">不能据此推导任意工程系统试压值</text><rect x="690" y="380" width="430" height="190" rx="18" class="box"/><text x="905" y="425" text-anchor="middle" class="t s">系统试压的工程思路</text><text x="720" y="465" class="t b">先确认设计压力与适用规范</text><text x="720" y="500" class="t b">再确定试验介质、压力、温度与保压</text><text x="720" y="535" class="t b">同时控制排气、隔离、仪表与安全区域</text><text x="600" y="650" text-anchor="middle" class="t s">关键：压力试验不是“压力越高越好”，而是按适用标准验证规定的失效模式。</text></svg>