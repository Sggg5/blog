<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:17px}.box{fill:#f6f9fc;stroke:#7890a5;stroke-width:2;rx:15}.key{fill:#edf5fb;stroke:#2f6f9f;stroke-width:2;rx:15}.a{stroke:#6f8799;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#6f8799"/></marker></defs><text x="55" y="60" class="t h">304为什么冷加工后会出现磁性？</text><rect x="60" y="135" width="260" height="150" class="box"/><text x="190" y="180" text-anchor="middle" class="t s">固溶/退火状态</text><text x="190" y="218" text-anchor="middle" class="t b">组织以奥氏体为主</text><text x="190" y="250" text-anchor="middle" class="t b">磁响应通常很弱</text><rect x="470" y="135" width="260" height="150" class="key"/><text x="600" y="180" text-anchor="middle" class="t s">弯管 / 拉伸 / 冲压</text><text x="600" y="218" text-anchor="middle" class="t b">局部塑性变形增加</text><text x="600" y="250" text-anchor="middle" class="t b">伴随明显加工硬化</text><rect x="880" y="135" width="260" height="150" class="key"/><text x="1010" y="180" text-anchor="middle" class="t s">局部组织变化</text><text x="1010" y="218" text-anchor="middle" class="t b">部分奥氏体可转变为</text><text x="1010" y="250" text-anchor="middle" class="t b">具有铁磁性的马氏体</text><path d="M320 210H465" class="a"/><path d="M730 210H875" class="a"/><rect x="155" y="385" width="890" height="175" class="box"/><text x="600" y="430" text-anchor="middle" class="t s">现场最容易误判的一点</text><text x="600" y="470" text-anchor="middle" class="t b">“磁铁能吸住”只能说明存在磁响应，不能单独证明材料不是304。</text><text x="600" y="505" text-anchor="middle" class="t b">磁响应还会受化学成分、冷加工量、焊缝铁素体、热处理状态和测量方法影响。</text><text x="600" y="540" text-anchor="middle" class="t b">牌号判定应回到材质证明、光谱/化学分析和适用标准，而不是只靠手持磁铁。</text></svg>