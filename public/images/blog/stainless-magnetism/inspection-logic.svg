<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#fff"/><style>.t{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#17324d}.h{font-size:34px;font-weight:700}.s{font-size:20px;font-weight:700}.b{font-size:16px}.box{fill:#f7fafc;stroke:#7a91a5;stroke-width:2;rx:14}.key{fill:#edf5fb;stroke:#2f6f9f;stroke-width:2;rx:14}.a{stroke:#71899c;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#71899c"/></marker></defs><text x="55" y="60" class="t h">发现304制品“吸磁”，工厂应该怎么查？</text><rect x="70" y="125" width="210" height="105" class="key"/><text x="175" y="165" text-anchor="middle" class="t s">① 先看位置</text><text x="175" y="198" text-anchor="middle" class="t b">弯角、扩口、冲压区？</text><rect x="365" y="125" width="210" height="105" class="box"/><text x="470" y="165" text-anchor="middle" class="t s">② 看加工历史</text><text x="470" y="198" text-anchor="middle" class="t b">变形量、矫直、切削</text><rect x="660" y="125" width="210" height="105" class="box"/><text x="765" y="165" text-anchor="middle" class="t s">③ 看焊缝</text><text x="765" y="198" text-anchor="middle" class="t b">焊缝铁素体可增大响应</text><rect x="955" y="125" width="180" height="105" class="box"/><text x="1045" y="165" text-anchor="middle" class="t s">④ 查材料</text><text x="1045" y="198" text-anchor="middle" class="t b">炉批号与材质证明</text><path d="M280 177H360" class="a"/><path d="M575 177H655" class="a"/><path d="M870 177H950" class="a"/><rect x="170" y="330" width="350" height="140" class="key"/><text x="345" y="372" text-anchor="middle" class="t s">只是来料/牌号争议？</text><text x="345" y="408" text-anchor="middle" class="t b">优先用PMI、光谱或化学分析</text><text x="345" y="438" text-anchor="middle" class="t b">结合标准规定的成分范围判定</text><rect x="680" y="330" width="350" height="140" class="key"/><text x="855" y="372" text-anchor="middle" class="t s">产品有低磁要求？</text><text x="855" y="408" text-anchor="middle" class="t b">把“磁铁吸不吸”改成磁导率指标</text><text x="855" y="438" text-anchor="middle" class="t b">并明确测量方法、场强与验收值</text><path d="M600 230V285H345V325" class="a"/><path d="M600 285H855V325" class="a"/><text x="600" y="570" text-anchor="middle" class="t s">结论：手持磁铁适合快速筛查，不适合单独作为304牌号的合格/不合格判据。</text><text x="600" y="610" text-anchor="middle" class="t b">如果功能真正依赖低磁性能，应把相对磁导率写进技术条件，并使用约定的方法测量。</text></svg>