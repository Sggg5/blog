<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#24364b}.t{font-size:28px;font-weight:700}.h{font-size:18px;font-weight:700}.p{font-size:15px}.b{fill:#f5f8fb;stroke:#526f8f;stroke-width:2}.a{stroke:#526f8f;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526f8f"/></marker></defs><text x="480" y="45" text-anchor="middle" class="t">固溶后异常，优先从哪里倒查？</text><rect x="355" y="80" width="250" height="70" rx="12" class="b"/><text x="480" y="112" text-anchor="middle" class="h">固溶后性能/组织异常</text><text x="480" y="136" text-anchor="middle" class="p">不要先凭炉温设定下结论</text><path d="M480 150 V195" class="a"/><rect x="70" y="210" width="230" height="110" rx="12" class="b"/><text x="185" y="242" text-anchor="middle" class="h">硬度偏高、成形仍硬</text><text x="185" y="272" text-anchor="middle" class="p">查实际管温、线速、有效加热长度</text><text x="185" y="298" text-anchor="middle" class="p">可能加热不足或时间不足</text><rect x="365" y="210" width="230" height="110" rx="12" class="b"/><text x="480" y="242" text-anchor="middle" class="h">表面氧化明显</text><text x="480" y="272" text-anchor="middle" class="p">查气氛、密封、露点/残氧</text><text x="480" y="298" text-anchor="middle" class="p">不能只靠后续酸洗补救工艺失控</text><rect x="660" y="210" width="230" height="110" rx="12" class="b"/><text x="775" y="242" text-anchor="middle" class="h">批次波动、头尾差异</text><text x="775" y="272" text-anchor="middle" class="p">查线速波动、测温位置、冷却一致性</text><text x="775" y="298" text-anchor="middle" class="p">关注启动/停机过渡段</text><path d="M480 195 L185 205" class="a"/><path d="M480 195 V205" class="a"/><path d="M480 195 L775 205" class="a"/><rect x="145" y="390" width="670" height="95" rx="12" fill="#edf3f8" stroke="#7d95ad"/><text x="480" y="422" text-anchor="middle" class="h">最终判断：用产品结果关闭工艺环</text><text x="480" y="453" text-anchor="middle" class="p">硬度/力学性能 + 金相 + 尺寸与表面 + 必要的腐蚀性能验证 → 固化参数窗口与报警界限</text></svg>