<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#fff"/><style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#24364b}.t{font-size:28px;font-weight:700}.h{font-size:20px;font-weight:700}.p{font-size:16px}.box{fill:#f4f7fb;stroke:#496b91;stroke-width:2}.arrow{stroke:#496b91;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#496b91"/></marker></defs><text x="480" y="48" text-anchor="middle" class="t">在线固溶不是“只看温度”：真正要控制的是热历史</text><rect x="55" y="110" width="210" height="120" rx="12" class="box"/><text x="160" y="145" text-anchor="middle" class="h">快速加热</text><text x="160" y="177" text-anchor="middle" class="p">进入目标固溶区间</text><text x="160" y="202" text-anchor="middle" class="p">关注管壁实际温度</text><rect x="375" y="110" width="210" height="120" rx="12" class="box"/><text x="480" y="145" text-anchor="middle" class="h">有效保温</text><text x="480" y="177" text-anchor="middle" class="p">组织均匀、溶解不利析出物</text><text x="480" y="202" text-anchor="middle" class="p">时间不足 ≠ 达到设定温度</text><rect x="695" y="110" width="210" height="120" rx="12" class="box"/><text x="800" y="145" text-anchor="middle" class="h">快速冷却</text><text x="800" y="177" text-anchor="middle" class="p">避免在不利温区停留过久</text><text x="800" y="202" text-anchor="middle" class="p">水量、喷淋、线速都重要</text><path d="M265 170 H365" class="arrow"/><path d="M585 170 H685" class="arrow"/><rect x="95" y="320" width="770" height="150" rx="14" fill="#eef3f8" stroke="#8299b3"/><text x="480" y="355" text-anchor="middle" class="h">现场应同时记录</text><text x="480" y="390" text-anchor="middle" class="p">炉温设定　＋　管壁测温　＋　线速度　＋　加热区有效长度　＋　冷却方式/水温/流量</text><text x="480" y="425" text-anchor="middle" class="p">再用硬度、拉伸/扩口、金相或腐蚀相关验证，把“参数”变成“合格工艺窗口”</text></svg>