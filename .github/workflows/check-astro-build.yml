name: Check Astro Site Build

on:
  push:
    branches: [main]
    paths:
      - "src/content/**"
      - "src/pages/**"
      - "src/lib/**"
      - "src/layouts/**"
      - "src/styles/**"
      - "public/images/blog/**"
      - "astro.config.mjs"
      - "src/content.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-astro-build.yml"
      - "scripts/check_blog_post.py"
      - "scripts/verify_blog_release.py"
      - "tests/test_blog_release_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Test blog release scripts
        run: |
          python3 -m py_compile scripts/check_blog_post.py scripts/verify_blog_release.py
          python3 -m unittest discover -s tests -p 'test_blog_release_v5.py' -v
      - name: Install dependencies
        run: npm ci
      - name: Build static Astro pages
        run: npm run build
      - name: Verify changed posts have generated HTML pages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          root = Path("src/content/blog")
          before = os.environ.get("BEFORE", "")
          after = os.environ.get("AFTER", "")
          event = os.environ.get("EVENT", "")
          if event == "workflow_dispatch" or not before or set(before) == {"0"}:
              changed = sorted(root.glob("*.md"))
          else:
              result = subprocess.run(
                  ["git", "diff", "--diff-filter=AM", "--name-only", "-z", before, after, "--", "src/content/blog/"],
                  capture_output=True, text=True, check=True,
              )
              changed = [Path(p) for p in result.stdout.split("\0") if p.endswith(".md")]
          if not Path("dist/index.html").is_file():
              raise SystemExit("Missing dist/index.html")
          for post in changed:
              if not post.is_file():
                  continue
              slug = post.stem
              candidates = [
                  Path("dist/blog") / slug / "index.html",
                  Path("dist/blog") / (slug + ".html"),
              ]
              if not any(p.is_file() for p in candidates):
                  raise SystemExit(f"Missing generated HTML for {post}: {candidates}")
              print(f"PASS: {post}")
          print(f"PASS: checked {len(changed)} changed Markdown posts")
          PY
