name: Check Astro Site Build

on:
  push:
    branches: [main]
    paths:
      - "src/content/**"
      - "src/pages/**"
      - "src/lib/**"
      - "src/layouts/**"
      - "src/styles/**"
      - "public/images/blog/**"
      - "astro.config.mjs"
      - "src/content.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/check-astro-build.yml"
      - "scripts/check_blog_post.py"
      - "scripts/verify_blog_release.py"
      - "scripts/article_routes.py"
      - "tests/test_blog_release_v5.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Test blog release scripts
        run: |
          python3 -m py_compile scripts/check_blog_post.py scripts/verify_blog_release.py scripts/article_routes.py
          python3 -m unittest discover -s tests -p 'test_blog_release_v5.py' -v
      - name: Install dependencies
        run: npm ci
      - name: Build static Astro pages
        run: npm run build
      - name: Verify changed posts have generated HTML pages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from article_routes import article_links, article_title, generated_html_path
          homepage = Path("dist/index.html")
          if not homepage.is_file():
              raise SystemExit("Missing dist/index.html")
          links = article_links(homepage.read_text(encoding="utf-8"))
          if not links:
              raise SystemExit("No blog links were found in the rendered homepage")
          before, after = os.environ.get("BEFORE", ""), os.environ.get("AFTER", "")
          event = os.environ.get("EVENT", "")
          if event == "workflow_dispatch" or not before or set(before) == {"0"}:
              changed = sorted(Path("src/content/blog").glob("*.md"))
          else:
              result = subprocess.run(
                  ["git", "diff", "--diff-filter=AM", "--name-only", "-z",
                   before, after, "--", "src/content/blog/"],
                  capture_output=True, text=True, check=True,
              )
              changed = [Path(p) for p in result.stdout.split("\0") if p.endswith(".md")]
          for post in changed:
              if not post.is_file():
                  continue
              title = article_title(post)
              href = links.get(title)
              if not href:
                  raise SystemExit(f"Article title absent from homepage: {post} {title}")
              built = generated_html_path(href)
              if not built.is_file():
                  raise SystemExit(f"Missing actual Astro HTML: {post} -> {href} -> {built}")
              print(f"PASS: {post} -> {href}")
          print(f"PASS: verified {len(changed)} changed Markdown posts")
          PY
