name: Sync Markdown posts to R2

on:
  push:
    branches:
      - main
    paths:
      - "src/content/blog/**/*.md"
      - ".github/workflows/sync-r2.yml"
  workflow_dispatch:

jobs:
  sync-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload Markdown posts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          shopt -s globstar nullglob
          for file in src/content/blog/**/*.md; do
            name="$(basename "$file")"
            npx wrangler@latest r2 object put "blog-content/posts/$name" --file "$file"
          done
