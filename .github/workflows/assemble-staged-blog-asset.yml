name: Assemble Staged Blog Asset
on:
  push:
    branches: [main]
    paths:
      - "tmp/blog-asset-staging/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-asset-assembly-main
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and verify binary asset
        run: python3 scripts/assemble_staged_blog_asset.py tmp/blog-asset-staging/manifest.json
      - name: Commit asset and remove staging payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp/blog-asset-staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/images/blog tmp/blog-asset-staging
          if git diff --cached --quiet; then
            echo "No new asset changes; staging payload already assembled."
            exit 0
          fi
          git commit -m "Assemble verified staged blog asset"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
